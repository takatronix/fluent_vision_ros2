[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fv-lerobot-exporter"
version = "0.1.0"
description = "Convert FluentVision recorder episodes into LeRobot v3 datasets"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "datasets>=4.0.0,<4.2.0",
    "lerobot>=0.4.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pyarrow>=16.0.0",
    "pydantic>=2.0.0",
    "rosbags>=0.10.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "av>=15.0.0",
    "opencv-python>=4.9.0",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fv_lerobot_exporter"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
