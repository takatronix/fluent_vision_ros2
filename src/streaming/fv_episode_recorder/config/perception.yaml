video_anomaly_detector:
  ros__parameters:
    input_image_topic: "/aspa/restamped/color_compressed"
    input_image_type: "compressed"
    compressed_relay_topic: "/perception/moss/image/compressed"
    compressed_relay_frequency: 1.0
    environment_change_topic: "/environment/change"
    model_path: "/home/aspa/.aspa/models/visual-condition-multihead.onnx"
    providers: "TensorrtExecutionProvider,CUDAExecutionProvider,CPUExecutionProvider"
    threshold: 0.50
    min_on_sec: 0.30
    min_off_sec: 0.30
    processing_frequency: 10.0

moss_realtime_adapter:
  ros__parameters:
    image_topic: "/perception/moss/image/compressed"
    image_type: "compressed"
    environment_change_topic: "/environment/change"
    environment_event_topic: "/environment/event"
    runtime_url: "ws://127.0.0.1:18081/v1/realtime"
    sample_fps: 1.0
    jpeg_quality: 85

episode_search:
  ros__parameters:
    service_name: "/episode/search"
    default_limit: 5
