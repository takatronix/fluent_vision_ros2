nodes:
  - key: fv_image_preview
    package: fv_image_preview
    exec: fv_image_preview_node
    category: streaming
    label: "Image Preview"
    inputs:
      - param: input_topics
        type: image
        label: "input images"
    outputs:
      - param: output_topics
        type: image
        label: "preview compressed images"
    default_parameters:
      input_topics: []
      output_topics: []
      labels: []
      max_width: 480
      max_fps: 2.0
      jpeg_quality: 45
      depth_min_mm: 200.0
      depth_max_mm: 5000.0
      diagnostics_interval_sec: 5.0
