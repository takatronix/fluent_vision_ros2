# Cube bundle definitions for piper_single_teleop profile.
#
# ID layout (must match docs/印刷物/cube_kit/MANIFEST.txt):
#   0        hand-eye calibration tag (handled separately, not a cube)
#   1-6      cube60_a faces (top, front, right, back, left, bottom)
#   7-12     cube60_b
#   13-18    cube60_c
#   19-20    reserved buffer
#   21-26    cube100_a
#   27-32    cube100_b
#   33-38    cube100_c
#
# Operator: when you re-print a cube with different IDs, update only
# this file (no node rebuild needed) and run ./restart.

fusion:
  max_age: 0.5
  # 10Hz: dispose/recreate at 30Hz in scene_viewer's Three.js layer
  # produced "polygon missing" flicker; the viewer is not yet retained.
  publish_rate: 10.0
  use_depth_refine: true
  min_decision_margin: 50.0
  world_frame: ""

cameras:
  - name: d405
    detections_topic: /d405_apriltag/detections
    poses_topic:      /d405_apriltag/poses
    depth_topic:      /d405_depth/image_rect_raw
    depth_info_topic: /d405_depth/camera_info
    camera_frame:     d405_optical_frame

cubes:
  cube60_a:
    size: 0.060
    tag_size: 0.050
    origin: bottom_center
    faces: {top: 1, front: 2, right: 3, back: 4, left: 5, bottom: 6}

  cube60_b:
    size: 0.060
    tag_size: 0.050
    origin: bottom_center
    faces: {top: 7, front: 8, right: 9, back: 10, left: 11, bottom: 12}

  cube60_c:
    size: 0.060
    tag_size: 0.050
    origin: bottom_center
    faces: {top: 13, front: 14, right: 15, back: 16, left: 17, bottom: 18}

  cube100_a:
    size: 0.100
    tag_size: 0.050
    origin: bottom_center
    faces: {top: 21, front: 22, right: 23, back: 24, left: 25, bottom: 26}

  cube100_b:
    size: 0.100
    tag_size: 0.050
    origin: bottom_center
    faces: {top: 27, front: 28, right: 29, back: 30, left: 31, bottom: 32}

  cube100_c:
    size: 0.100
    tag_size: 0.050
    origin: bottom_center
    faces: {top: 33, front: 34, right: 35, back: 36, left: 37, bottom: 38}
