# fv_apriltag tag ID registry — tag36h11 (587 ids).
# Single source of truth for ID allocation. Update HERE first;
# printed assets, mount pairing and downstream configs follow this file.
#
# v2 (2026-07-12): bands reorganized for the work-surface calibration
# system. Principles:
#   - id = MEANING (class); individuals of one class are told apart by
#     position, EXCEPT surface corners which get distinct ids so an
#     uncalibrated fixed camera can one-shot PnP its extrinsics.
#   - low bands (0-49) = permanently installed infrastructure
#     (calibration, surface corners, dock, navigation anchors).
#   - cube faces moved 1-38 -> 300 band (see legacy below).
#
# Print sizes: tag_mm is the black-border edge; paper = tag_mm + 5mm
# margin per side (cut along the margin edge). 3D-printable two-colour
# plates: tools/generate_tag_mounts.py --flat-plates.
family: tag36h11
allocations:
  - { ids: [0, 9],     class: calibration, tag_mm: 50,
      note: "0 = hand-eye / desk plate. multiple copies of one id are
             fine (position tells them apart)" }
  - { ids: [10, 19],   class: surface_corner, tag_mm: 50,
      note: "work-surface corner anchors, DISTINCT id per corner;
             10-13 = first surface. known-truth PnP targets for fixed
             cameras + extrinsics health checks" }
  - { ids: [20, 29],   class: dock, label: "DOCK", tag_mm: 100,
      note: "20 = home/charge dock final-approach target" }
  - { ids: [30, 49],   class: navigation, tag_mm: 150,
      note: "row entry / U-turn anchors: row k -> north 30+2k,
             south 31+2k" }
  - { ids: [50, 50],   class: keep_out,  label: "KEEP OUT",  tag_mm: 100,
      note: "field zone marker: do not enter" }
  - { ids: [51, 51],   class: stop,      label: "STOP",      tag_mm: 100 }
  - { ids: [52, 52],   class: slow,      label: "SLOW",      tag_mm: 100 }
  - { ids: [53, 99],   class: safety_reserved }
  - { ids: [100, 109], class: mother_stem_no_harvest,
      label: "MOTHER STEM - NO HARVEST", tag_mm: 50,
      note: "class id 100 for every stem (position tells them apart);
             101-109 only if per-row grouping becomes necessary" }
  - { ids: [110, 199], class: domain_reserved }
  - { ids: [200, 299], class: project_reserved,
      note: "per-project extension band (co-hosted stacks allocate
             their own ids here)" }
  - { ids: [300, 317], class: cube60_faces,  tag_mm: 50,
      note: "cube_kit cube60_a..c faces, top/front/right/back/left/
             bottom from base ids 300/306/312" }
  - { ids: [318, 319], class: reserved_buffer }
  - { ids: [320, 337], class: cube100_faces, tag_mm: 50,
      note: "cube_kit cube100_a..c faces from base ids 320/326/332" }

# Retired v1 bands. Do NOT reallocate these ids until the physical
# assets are out of circulation and runtime configs switched over.
legacy:
  - { ids: [1, 18],  class: cube60_faces,
      note: "v1 cube band — printed cubes may still circulate; retire
             when cubes are reprinted at 300+ and cubes_piper.yaml /
             cubes_daihen.yaml are switched" }
  - { ids: [21, 38], class: cube100_faces, note: "v1 cube band — same" }
  - { ids: [40, 44], class: calib_board_aux,
      note: "v1 future-reserved board — superseded by surface_corner
             10-19" }
  - { ids: [60, 62], class: field_markers_v1,
      note: "v1 HOME/ROW ids — replaced by dock 20 and navigation
             30-band; paper sheets regenerated, never deployed" }
