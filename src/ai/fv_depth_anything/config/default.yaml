fv_depth_anything:
  ros__parameters:
    input_image_topic: "/fv/d405/color/image_raw"
    camera_info_topic: "/fv/d405/depth/camera_info"

    depth_topic: "depth_anything/image"
    depth_colored_topic: "depth_anything/image_color"
    pointcloud_topic: "depth_anything/points"
    frame_id_override: ""

    # Backend: "onnx" (arm64/x64) or "tensorrt" (GPU accelerated)
    backend: "onnx"

    # Model path (inside container: /ros2_ws/models/depth_anything_v3/)
    # DA3-Small (relative depth, fast):
    #   model_path: "/ros2_ws/models/depth_anything_v3/onnx-community-small/onnx/model.onnx"
    # DA3METRIC-LARGE (metric depth, accurate):
    #   model_path: "/ros2_ws/models/depth_anything_v3/DA3METRIC-LARGE.onnx"
    model_path: "/ros2_ws/models/depth_anything_v3/onnx-community-small/onnx/model.onnx"
    model_variant: "small"

    # Inference resolution (DA3 uses 518x518)
    inference_width: 518
    inference_height: 518

    # Depth settings
    min_depth_m: 0.1
    max_depth_m: 10.0
    metric_depth: false  # Set true when using DA3METRIC models
    point_stride: 2
    publish_pointcloud: false
    publish_colored: true
    colormap: 20  # COLORMAP_INFERNO

    # QoS / Performance
    qos_reliability: "best_effort"
    processing_frequency: 0.0  # 0 = process every frame
    log_every_n_frames: 30
