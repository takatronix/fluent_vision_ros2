# node_manifest.yaml — fv_aspara_points
# Asparagus 3D Point Accumulation

nodes:
  - key: fv_aspara_points
    package: fv_aspara_points
    exec: fv_aspara_points_node
    category: ai
    label: "Aspara Points"

    inputs:
      - param: detections_topic
        type: detections
      - param: pointcloud_topic
        type: pointcloud

    outputs:
      - param: markers_topic
        type: any
        label: markers

    default_parameters:
      detections_topic: ""
      pointcloud_topic: ""
