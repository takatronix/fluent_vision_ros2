# node_manifest.yaml — fv_face_recognizer
# Real-time Face Recognition

nodes:
  - key: fv_face_recognizer
    package: fv_face_recognizer
    exec: fv_face_recognizer_node
    category: ai
    label: "Face Recognizer"

    inputs:
      - param: input_topic
        type: image

    outputs:
      - param: output_topic
        type: image
        label: annotated

    default_parameters:
      input_topic: ""
      output_topic: ""
