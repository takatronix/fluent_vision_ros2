[package]
name = "fv-kws-ros2"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[[bin]]
name = "fv_kws"
path = "src/bin/fv_kws.rs"
required-features = ["ros2"]

[[bin]]
name = "fv_kws_model_check"
path = "src/bin/fv_kws_model_check.rs"

[[bin]]
name = "fv_kws_benchmark"
path = "src/bin/fv_kws_benchmark.rs"

[features]
default = []
ros2 = ["dep:ctrlc", "dep:futures", "dep:r2r"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
vosk = "=0.3.1"
thiserror = "2.0"
hound = "3.5"

ctrlc = { version = "3.5", optional = true }
futures = { version = "0.3", optional = true }
r2r = { version = "0.9.5", optional = true }
