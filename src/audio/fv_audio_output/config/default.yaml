fv_audio_output:
  ros__parameters:
    audio.device_id: "default"
    audio.volume_topic: "/audio/output/volume"
    audio.volume: 1.0
    audio.sample_rate: 48000
    audio.channels: 1
    audio.bit_depth: 16
    audio.start_threshold_frames: 0
    audio.drain_after_frame: false
    audio.reconnect.enabled: true
    audio.reconnect.interval_ms: 1000
    # Optional hardware mixer restoration after a USB reconnect.
    # Example: card="hw:UACDemoV10", control="PCM", volume_percent=100
    audio.mixer.card: ""
    audio.mixer.control: "PCM"
    audio.mixer.volume_percent: -1
    queue.max_frames: 32
