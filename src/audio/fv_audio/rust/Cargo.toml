[package]
name = "fv-audio-ros2"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"

[[bin]]
name = "audio_capture"
path = "src/bin/audio_capture.rs"

[[bin]]
name = "audio_device_registry"
path = "src/bin/audio_device_registry.rs"

[[bin]]
name = "audio_aec"
path = "src/bin/audio_aec.rs"

[[bin]]
name = "audio_output"
path = "src/bin/audio_output.rs"

[[bin]]
name = "playback_controller"
path = "src/bin/playback_controller.rs"

[[bin]]
name = "tts_timing_collector"
path = "src/bin/tts_timing_collector.rs"

[dependencies]
cpal = "0.18.1"
ctrlc = "3.5"
futures = "0.3"
gstreamer = "0.25.2"
gstreamer-app = "0.25.2"
libc = "0.2"
r2r = "0.9.5"
ringbuf = "0.4.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
webrtc-audio-processing = { version = "~2.1", features = ["bundled"] }
webrtc-audio-processing-config = "2.1"
