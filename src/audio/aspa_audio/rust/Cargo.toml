[package]
name = "aspa-audio-ros2"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"

[[bin]]
name = "audio_capture"
path = "src/bin/audio_capture.rs"

[[bin]]
name = "audio_output"
path = "src/bin/audio_output.rs"

[[bin]]
name = "playback_controller"
path = "src/bin/playback_controller.rs"

[dependencies]
cpal = "0.18.1"
ctrlc = "3.5"
futures = "0.3"
gstreamer = "0.25.2"
gstreamer-app = "0.25.2"
r2r = "0.9.5"
thiserror = "2.0"
