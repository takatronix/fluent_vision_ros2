[package]
name = "aspa-audio-ros2"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[[bin]]
name = "audio_capture"
path = "src/bin/audio_capture.rs"

[[bin]]
name = "audio_output"
path = "src/bin/audio_output.rs"

[dependencies]
cpal = "0.18.1"
ctrlc = "3.5"
futures = "0.3"
r2r = "0.9.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
