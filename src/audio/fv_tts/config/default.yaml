fv_tts:
  ros__parameters:
    # エンジン: "pyopenjtalk"(軽量・既定) | "aivis" (AivisSpeech。不通・遅いときは Open JTalk)
    engine: "pyopenjtalk"
    # AivisSpeech Engine の URL。"" = 未設定 (engine=aivis なら http://127.0.0.1:10101)
    aivis_url: ""
    aivis_speaker: 135718976       # 女 (男は 1310138977)。viewer の設定で切り替わる
    # 出力パイプライン(fv_audio_output)のサンプルレート。AivisSpeech は 44.1kHz を返すので
    # このレートへリサンプルしてから publish する(fv_audio_output の audio.sample_rate と合わせる)。
    output_sample_rate: 48000
    default_voice: ""
    output_topic: "audio/tts/frame"
    playback_topic: "audio/output/frame"
    use_playback_topic: true
    # Event Bus 契約: 任意テキスト発話 topic と 再生中フラグ
    say_topic: "/aspa/tts/say"
    speaking_topic: "/aspa/audio/speaking"
    settings_topic: "/aspa/tts/settings"
    cache_dir: "~/.fluent_voice_cache"
    # Open JTalk は小さめなので +8dB。AivisSpeech の声は voice_cache_volume_db (0dB)。
    default_volume_db: 8.0
