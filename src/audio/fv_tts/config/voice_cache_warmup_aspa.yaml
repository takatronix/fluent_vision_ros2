# 声キャッシュのウォームアップ文 (aspa)。起動後に裏で低優先度で作っておき、
# 初回から高品質の声で喋れるようにする。voice_cache_warmup_file で指定。
#
# 2026-10-20 aspa-navigation から抽出: fv_soundboard events.yaml の say (speak:true)、
# bridge_node.py / wall_mode.py / scene_viewer_node.py の固定文、log_tts の実績。
# 数値や名前が入る文 (「3本目、成功」「畝1の…」等) は毎回変わるので入れない。
# 載っていない文も、一度喋れば裏で作られて次回からキャッシュの声になる。
texts:
  # fv_soundboard イベント
  - 準備ができました
  - 手動運転モードに切り替えました
  - 待機モードに切り替えました
  - 目的地へ移動中です
  - 巡回モードに切り替えました
  - 収穫モードに切り替えました
  - 非常停止しました
  - 自動運転を開始します
  - 自動運転を停止しました
  - 停止します
  - 目的地に到着しました
  - 経路がふさがれています
  - バッテリー残量が少なくなっています
  - 自己位置を見失いました
  - A品を検出しました
  - B品を検出しました
  - バッテリーがありません。充電してください
  - センサーが応答しません
  - センサーが復帰しました
  - システムに異常があります
  - 温度が高くなっています
  - 通信が切れました
  # 走行・収穫 (bridge_node.py)
  - 収穫を始めます。畝へ向かいます。
  - 収穫を再開します。
  - 走行を再開できます
  - 畝の端で折り返します。
  - 旋回します。
  - 向きを合わせます。
  - 畝の向きに合わせます。
  - まずホームへ戻ります。
  - 始められませんでした。
  - 繰り返しをオンにしました。
  - 繰り返しをオフにしました。一周したらホームへ戻ります。
  - 一周しました。繰り返しなので続けます。
  - ホームへ戻れなかったので、始められません。
  - 人が近くに居るので止まります。離れたら再開します。
  - CuGo のドライバを起動し直します。30 秒ほど待ってください。
  - CuGo が復帰しました。走行できます。
  - CuGo のドライバを戻しました。走行の再許可を押してください。
  - CuGo のドライバを戻せませんでした。CuGo の電源を切って、USB を抜き、電源を入れて、USB を挿してください。
  # 壁並走 (wall_mode.py)
  - 壁並走をオンにしました。今の区間はこのまま走り、次の区間から壁に沿います。
  - 壁並走の設定を変えたので走行を止めました。もう一度目的地か巡回を始めてください。
  - 壁並走を再開します。
  # 起動時・点検
  - スラムを初期化しています。10秒ほど、ロボットを動かさないでください
  - 音声を確認します。メインカメラは正常です
