# FV Depth Camera - Default Configuration
# Simple and clean configuration for RealSense cameras

fv_realsense:
  ros__parameters:
    # Camera selection
    camera_selection:
      selection_method: "auto"      # "auto", "serial", "name", "index"
      serial_number: ""             # Specific serial number
      device_name: ""               # Device name (partial match)
      device_index: 0               # Device index
    
    # Power management for Raspberry Pi
    power_management:
      startup_delay: 0.5            # Delay before starting streams (seconds)
    
    # Camera settings
    camera:
      color_width: 320
      color_height: 240
      color_fps: 10
      depth_width: 320
      depth_height: 240
      depth_fps: 10
    
    # Stream settings
    streams:
      color_enabled: true
      depth_enabled: false
      infrared_enabled: false
      pointcloud_enabled: false
      depth_colormap_enabled: false
      sync_enabled: true            # 深度・カラー同期有効
    
    # Exposure / gain / white balance per sensor (color = RGB, depth = stereo
    # module). auto_exposure: false = fixed-exposure mode; exposure/gain -1
    # = "lock here": exposure/gain are steered until the image is as bright
    # as just before the lock (frame rate kept). Explicit values win. Can be
    # changed at runtime with `ros2 param set`. See README (露出固定モード).
    color:
      auto_exposure: true
      exposure: -1
      gain: -1
      auto_white_balance: true
      white_balance: -1
      auto_exposure_priority: -1
    depth:
      auto_exposure: true
      exposure: -1
      gain: -1

    # Point cloud (streams.pointcloud_enabled): computed only while subscribed.
    pointcloud:
      min_distance: 0.1
      max_distance: 3.0
      decimation: 2        # 1 = every depth pixel, 2 = 1/4 of the points
      publish_hz: 0.0      # 0 = every frame

    # Camera info and compression
    camera_info:
      enable_camera_info: false
      enable_compressed_topics: false
      compressed_quality: 85
      enable_depth_compressed: false
    
    # Services
    services:
      get_distance_enabled: false
      get_camera_info_enabled: false
    
    # TF settings
    tf:
      enabled: false
      base_frame: "base_link"
      camera_frame: "camera_link"
      color_optical_frame: "color_optical_frame"
      depth_optical_frame: "depth_optical_frame"
    
    # Topics
    topics:
      color: "color/image_raw"
      depth: "depth/image_rect_raw"
      color_compressed: "color/image_raw/compressed"
      depth_colormap: "depth/colormap"
      pointcloud: "depth/color/points" 