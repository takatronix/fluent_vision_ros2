fv_policy_runner:
  ros__parameters:
    image_topics:
      - "~/image/top_camera"
      - "~/image/arm_camera"
    image_names:
      - "top_camera"
      - "arm_camera"
    state_topic: "~/state/joint_states"
    trigger_topic: "~/trigger/start"
    stop_topic: "~/trigger/stop"
    policy_select_topic: "~/policy/select"
    prompt_topic: "~/policy/prompt"
    action_topic: "policy/action"
    joint_action_topic: "policy/joint_action"
    status_topic: "policy/status"
    trajectory_topic: "policy/trajectory_markers"
    action_joint_names: []
    profile_path: "/vlabor/profiles/active_profile.yaml"
    profile_arm_namespace: "follower_arm"
    backend_endpoint: "http://127.0.0.1:8010/infer"
    backend_timeout_sec: 180.0
    observation_format: "aloha"
    default_policy_id: "pi05_week19_morikawa_all_20k"
    compare_policy_ids: []
    default_prompt: "move the arm"
    publish_hz: 10.0
    replenish_threshold_steps: 5
    observation_max_age_sec: 0.5
    image_transport_encoding: "rgb8"
    image_codec: "jpg"
    image_quality: 90
    auto_start: false
    trajectory_publish: true
    trajectory_mode: "fk"
    trajectory_frame_id: "base_link"
    trajectory_action_indices: [0, 1, 2]
    trajectory_scale: 1.0
    trajectory_z_offset: 0.0
    trajectory_offset_xyz: [0.0, 0.0, 0.0]
    trajectory_line_width: 0.02
    trajectory_label_height: 0.08
    trajectory_lifetime_sec: 2.0
    trajectory_fk_urdf_topic: "/robot_description"
    trajectory_fk_urdf_topic_timeout_sec: 3.0
    trajectory_fk_urdf_path: ""
    trajectory_fk_base_link: "base_link"
    trajectory_fk_tip_link: "gripper_tip"
    trajectory_fk_joint_names: ["joint1", "joint2", "joint3", "joint4", "joint5", "joint6", "gripper"]
