system:
  default_start_delay: 0.5
  camera_start_delay: 3.0
  inter_group_delay: 1.0

groups:
  # This sample only defines LingBot-Depth.
  # Merge this group into your existing /config/fluent_vision_system.yaml.
  - id: lingbot_depth
    enable: true
    nodes:
      - id: fv_lingbot_depth_d405
        enable: true
        package: fv_lingbot_depth
        exec: fv_lingbot_depth_node
        node_name: fv_lingbot_depth_d405
        namespace: "/fv/d405"
        parameters:
          color_topic: "/fv/d405/color/image_raw"
          depth_topic: "/fv/d405/depth/image_rect_raw"
          camera_info_topic: "/fv/d405/depth/camera_info"
          refined_depth_topic: "/fv/d405/depth_refined/image_rect_raw"
          mask_topic: "/fv/d405/depth_refined/mask"
          pointcloud_topic: "/fv/d405/depth_refined/points"
          model_id: "robbyant/lingbot-depth-pretrain-vitl-14"
          device: "auto"
          use_fp16: true
          apply_mask: true
          fallback_passthrough: true
        respawn: true
        respawn_delay: 2.0
