<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FluentVision Pipeline Editor</title>
<style>
/* ================================================================
   FluentVision Pipeline Editor — Styles
   ================================================================ */
:root {
  --bg: #1a1a2e;
  --bg2: #16213e;
  --bg3: #0f3460;
  --text: #e0e0e0;
  --text2: #aaa;
  --accent: #00d9ff;
  --border: #333;
  --danger: #ff5252;
  --success: #00e676;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  height: 100vh;
}

/* --- Toolbar --- */
#toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  height: 42px;
  z-index: 100;
}

#toolbar select, #toolbar input, #toolbar button {
  font-size: 13px;
  padding: 4px 8px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  outline: none;
}

#toolbar button {
  cursor: pointer;
  transition: background 0.15s;
}
#toolbar button:hover { background: var(--bg3); }
#toolbar button.primary {
  background: var(--bg3);
  border-color: var(--accent);
  color: var(--accent);
}
#toolbar button.danger {
  border-color: var(--danger);
  color: var(--danger);
}
#toolbar button.has-running {
  border-color: var(--success);
  color: var(--success);
  box-shadow: 0 0 14px rgba(0, 230, 118, 0.18);
}

#toolbar .sep {
  width: 1px;
  height: 24px;
  background: var(--border);
  margin: 0 4px;
}

#toolbar .label {
  font-size: 12px;
  color: var(--text2);
}

#pipelineDir {
  max-width: 200px;
  font-size: 11px;
  color: var(--text2);
}

/* --- Canvas --- */
#canvasWrap {
  position: relative;
  width: 100%;
  height: calc(100vh - 42px - 28px); /* toolbar + log header */
}

#mainCanvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: default;
}

/* --- Palette overlay --- */
#paletteOverlay {
  display: none;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 200;
  justify-content: center;
  align-items: flex-start;
  padding-top: 40px;
}
#paletteOverlay.open { display: flex; }

#palette {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  width: 600px;
  max-height: 80vh;
  overflow-y: auto;
  padding: 16px;
}

#palette h3 { font-size: 14px; margin-bottom: 10px; color: var(--accent); }
#paletteSearch {
  width: 100%;
  padding: 8px;
  margin-bottom: 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-size: 13px;
}

.palette-category { margin-bottom: 16px; }
.palette-category h4 {
  font-size: 12px;
  color: var(--text2);
  text-transform: uppercase;
  margin-bottom: 6px;
  letter-spacing: 1px;
}

.palette-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  cursor: pointer;
  border-radius: 4px;
  transition: background 0.15s;
}
.palette-item:hover { background: var(--bg3); }

.palette-item .badge {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: bold;
  min-width: 32px;
  text-align: center;
}

.palette-item .info {
  flex: 1;
}
.palette-item .info .name { font-size: 13px; }
.palette-item .info .ports {
  font-size: 11px;
  color: var(--text2);
}

/* --- Edit panel --- */
#editPanel {
  display: none;
  position: absolute;
  top: 60px;
  right: 16px;
  width: 340px;
  max-height: calc(100vh - 120px);
  overflow-y: auto;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  z-index: 150;
}
#editPanel.open { display: block; }

#editPanel h3 {
  font-size: 14px;
  margin-bottom: 12px;
  color: var(--accent);
}

#editPanel label {
  display: block;
  font-size: 12px;
  color: var(--text2);
  margin-bottom: 3px;
  margin-top: 8px;
}

#editPanel input, #editPanel textarea, #editPanel select {
  width: 100%;
  padding: 6px 8px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-size: 12px;
  font-family: monospace;
}

#editPanel textarea { height: 160px; resize: vertical; }

#editPanel .btn-row {
  display: flex;
  gap: 6px;
  margin-top: 12px;
}

#editPanel .btn-row button {
  flex: 1;
  padding: 6px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  font-size: 12px;
}
#editPanel .btn-row button.primary {
  background: var(--bg3);
  border-color: var(--accent);
  color: var(--accent);
}
#editPanel .btn-row button.danger {
  border-color: var(--danger);
  color: var(--danger);
}

/* --- Docker panel --- */
#dockerPanel {
  display: none;
  position: absolute;
  top: 54px;
  right: 16px;
  width: min(880px, calc(100vw - 32px));
  max-height: calc(100vh - 120px);
  overflow-y: auto;
  background:
    radial-gradient(circle at 20% 0%, rgba(0, 217, 255, 0.13), transparent 30%),
    linear-gradient(135deg, rgba(22,33,62,0.98), rgba(12,18,35,0.98));
  border: 1px solid rgba(0, 217, 255, 0.28);
  border-radius: 14px;
  padding: 14px;
  z-index: 145;
  box-shadow: 0 18px 70px rgba(0,0,0,0.42);
}
#dockerPanel.open { display: block; }
#dockerPanel h3 {
  font-size: 16px;
  margin-bottom: 3px;
  color: var(--accent);
}
.docker-header {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-start;
  margin-bottom: 12px;
}
.docker-subtitle {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.45;
}
.docker-summary {
  display: grid;
  grid-template-columns: repeat(4, minmax(90px, 1fr));
  gap: 8px;
  margin-bottom: 12px;
}
.docker-metric {
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 9px 10px;
  background: rgba(0,0,0,0.19);
}
.docker-metric-value {
  font-size: 18px;
  color: var(--text);
}
.docker-metric-label {
  font-size: 10px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-top: 2px;
}
.docker-actions {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}
.docker-actions select {
  flex: 1.4;
  padding: 6px 8px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 12px;
}
.docker-actions button {
  flex: 0.7;
  padding: 6px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  font-size: 12px;
}
.docker-main {
  display: grid;
  grid-template-columns: minmax(280px, 1fr) minmax(320px, 0.95fr);
  gap: 12px;
}
.docker-card {
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  background: rgba(0,0,0,0.14);
  padding: 12px;
}
.docker-template-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 12px;
}
.docker-template-card {
  border: 1px solid rgba(0, 217, 255, 0.18);
  border-radius: 10px;
  padding: 9px;
  background: rgba(0, 217, 255, 0.045);
  cursor: pointer;
  transition: border-color 0.15s, transform 0.15s, background 0.15s;
}
.docker-template-card:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
  background: rgba(0, 217, 255, 0.09);
}
.docker-template-title {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
  color: var(--text);
  margin-bottom: 5px;
}
.docker-template-meta {
  font-size: 10px;
  color: var(--text2);
  line-height: 1.35;
  word-break: break-all;
}
.docker-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.docker-section-title {
  margin: 14px 0 8px;
  font-size: 11px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.docker-item {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  background: rgba(0,0,0,0.15);
  cursor: pointer;
}
.docker-item.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px rgba(0, 217, 255, 0.25) inset;
}
.docker-item-title {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 6px;
  font-size: 13px;
}
.docker-item-meta {
  font-size: 11px;
  color: var(--text2);
  margin-bottom: 8px;
  line-height: 1.4;
  word-break: break-all;
}
.docker-item-detail {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 5px;
  margin-bottom: 8px;
}
.docker-chip {
  border-radius: 999px;
  padding: 3px 7px;
  background: rgba(255,255,255,0.06);
  color: var(--text2);
  font-size: 10px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.docker-item-row {
  display: flex;
  gap: 6px;
}
.docker-item-row button {
  flex: 1;
  padding: 5px 6px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  font-size: 11px;
}
.docker-status-running { color: var(--success); }
.docker-status-exited,
.docker-status-stopped,
.docker-status-error { color: var(--danger); }
.docker-status-created,
.docker-status-starting { color: #ffa726; }
.docker-editor {
  margin-top: 0;
  border-top: 0;
  padding-top: 0;
}
.docker-editor label {
  display: block;
  font-size: 12px;
  color: var(--text2);
  margin-bottom: 4px;
  margin-top: 8px;
}
.docker-editor input,
.docker-editor select,
.docker-editor textarea {
  width: 100%;
  padding: 6px 8px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-size: 12px;
  font-family: monospace;
}
.docker-editor textarea {
  min-height: 260px;
  resize: vertical;
}
.docker-editor-buttons {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}
.docker-editor-buttons button {
  flex: 1;
  padding: 6px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  font-size: 12px;
}
.docker-empty {
  font-size: 12px;
  color: var(--text2);
  padding: 8px 0;
}
@media (max-width: 760px) {
  #dockerPanel {
    right: 8px;
    width: calc(100vw - 16px);
  }
  .docker-header,
  .docker-main {
    display: block;
  }
  .docker-summary,
  .docker-template-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .docker-card {
    margin-bottom: 10px;
  }
}

/* --- Log panel --- */
#logPanel {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 180px;
  background: rgba(10,10,20,0.95);
  border-top: 1px solid var(--border);
  z-index: 160;
  display: flex;
  flex-direction: column;
  transition: transform 0.2s ease;
}
#logPanel.collapsed {
  transform: translateY(calc(100% - 28px));
}

#logHeader {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 12px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  height: 28px;
  flex-shrink: 0;
  user-select: none;
}

#logHeader span {
  font-size: 12px;
  color: var(--text2);
}

#logHeader .log-title {
  color: var(--text);
  font-weight: bold;
}

#logHeader button {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text2);
  cursor: pointer;
  margin-left: 4px;
}
#logHeader button:first-of-type {
  margin-left: auto;
}

#logBody {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
  font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  font-size: 11px;
  line-height: 1.5;
}

.log-entry {
  padding: 1px 12px;
  white-space: pre-wrap;
  word-break: break-all;
}

.log-entry .log-time {
  color: #666;
  margin-right: 6px;
}

.log-entry.log-info { color: #8cb4d8; }
.log-entry.log-success { color: #00e676; }
.log-entry.log-warn { color: #ffa726; }
.log-entry.log-error { color: #ff5252; }
.log-entry.log-ws { color: #bb86fc; }

.log-badge {
  display: inline-block;
  padding: 0 4px;
  border-radius: 2px;
  font-size: 10px;
  font-weight: bold;
  margin-right: 4px;
}
.log-badge.launch { background: #0a3320; color: #00e676; }
.log-badge.stop { background: #3d0a0a; color: #ff5252; }
.log-badge.status { background: #1a1a3e; color: #4fc3f7; }
.log-badge.ws { background: #2a1a3e; color: #bb86fc; }
.log-badge.error { background: #3d0a0a; color: #ff5252; }
.log-badge.save { background: #2a2a0a; color: #ffa726; }

/* --- Toast --- */
#toast {
  display: none;
  position: fixed;
  bottom: 200px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 20px;
  background: var(--bg3);
  border: 1px solid var(--accent);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  z-index: 1000;
}
</style>
</head>
<body>

<!-- Toolbar -->
<div id="toolbar">
  <span class="label">Pipeline:</span>
  <select id="pipelineSelect"><option value="">-- none --</option></select>
  <button id="btnNew">New</button>
  <button id="btnSave" class="primary">Save</button>
  <button id="btnSaveAs">Save As</button>
  <button id="btnDelete" class="danger">Delete</button>
  <div class="sep"></div>
  <button id="btnAddNode" class="primary">+ Add Node</button>
  <div class="sep"></div>
  <button id="btnLaunchAll" class="primary">Launch All</button>
  <button id="btnStopAll" class="danger">Stop All</button>
  <button id="btnDocker">Docker <span id="dockerToolbarCount">0/0</span></button>
  <div class="sep"></div>
  <span id="pipelineDir" title="Pipeline directory"></span>
</div>

<!-- Canvas -->
<div id="canvasWrap">
  <canvas id="mainCanvas"></canvas>
</div>

<!-- Palette overlay -->
<div id="paletteOverlay">
  <div id="palette">
    <h3>Add Node</h3>
    <input type="text" id="paletteSearch" placeholder="Search nodes...">
    <div id="paletteContent"></div>
  </div>
</div>

<!-- Edit panel -->
<div id="editPanel">
  <h3 id="editTitle">Edit Node</h3>
  <label>Node Name</label>
  <input id="editNodeName" type="text">
  <label>Namespace</label>
  <input id="editNamespace" type="text">
  <label>Parameters (JSON)</label>
  <textarea id="editParams"></textarea>
  <div class="btn-row">
    <button class="primary" id="btnEditApply">Apply</button>
    <button id="btnEditLaunch">Start</button>
    <button id="btnEditStop">Stop</button>
    <button class="danger" id="btnEditDelete">Delete</button>
    <button id="btnEditClose">Close</button>
  </div>
</div>

<!-- Docker panel -->
<div id="dockerPanel">
  <div class="docker-header">
    <div>
      <h3>Docker Runtimes</h3>
      <div class="docker-subtitle">GPU-heavy policy/depth workers live outside the ROS2 process. Save the container spec with the pipeline, then start it before the dependent nodes.</div>
    </div>
    <div class="docker-actions">
      <select id="dockerTemplateSelect"></select>
      <button id="btnDockerAdd">Add</button>
      <button id="btnDockerRefresh">Refresh</button>
      <button id="btnDockerClose">Close</button>
    </div>
  </div>
  <div id="dockerSummary" class="docker-summary"></div>
  <div class="docker-main">
    <div class="docker-card">
      <div class="docker-section-title">Runtime Templates</div>
      <div id="dockerTemplateGrid" class="docker-template-grid"></div>
      <div class="docker-section-title">Pipeline Containers</div>
      <div id="dockerList" class="docker-list"></div>
    </div>
    <div class="docker-card docker-editor">
      <div class="docker-section-title">Container Editor</div>
      <label>Container ID</label>
      <input id="dockerEditId" type="text" placeholder="openpi_runtime_1">
      <label>Template</label>
      <select id="dockerEditTemplate"></select>
      <label>Parameters (JSON)</label>
      <textarea id="dockerEditParams"></textarea>
      <div class="docker-editor-buttons">
        <button id="btnDockerApply">Apply</button>
        <button id="btnDockerStart">Start</button>
        <button id="btnDockerStop">Stop</button>
        <button id="btnDockerLogs">Logs</button>
        <button id="btnDockerRemove">Remove</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Log panel -->
<div id="logPanel" class="collapsed">
  <div id="logHeader" onclick="toggleLogPanel()">
    <span class="log-title">Log</span>
    <span id="logCount">0</span>
    <button onclick="event.stopPropagation(); copyLog()">Copy</button>
    <button onclick="event.stopPropagation(); clearLog()">Clear</button>
  </div>
  <div id="logBody"></div>
</div>

<script>
/* ================================================================
   FluentVision Pipeline Editor — Frontend
   ================================================================ */

// ---------------------------------------------------------------------------
// Constants
// ---------------------------------------------------------------------------
const HEADER_H = 30;
const PORT_H = 22;
const FOOTER_H = 20;
const PAD = 8;
const NODE_MIN_W = 160;
const NODE_MAX_W = 500;
const NODE_DEFAULT_W = 210;
const PORT_R = 6;
const PORT_HIT_R = 14;
const EDGE_HIT_DIST = 8;
const RESIZE_HANDLE = 14;

const COLORS = {
  sensor:    { bg: 'rgba(0,50,70,0.85)', border: '#00d9ff', text: '#00d9ff', badge: 'CAM', badgeBg: '#004466' },
  ai:        { bg: 'rgba(50,20,70,0.85)', border: '#bb86fc', text: '#bb86fc', badge: 'AI',  badgeBg: '#3d1466' },
  streaming: { bg: 'rgba(20,50,35,0.85)', border: '#00e676', text: '#00e676', badge: 'OUT', badgeBg: '#0a3320' },
  audio:     { bg: 'rgba(50,35,10,0.85)', border: '#ffa726', text: '#ffa726', badge: 'SND', badgeBg: '#3d2a0a' },
  ui:        { bg: 'rgba(50,20,40,0.85)', border: '#f06292', text: '#f06292', badge: 'UI',  badgeBg: '#3d0a28' },
  utils:     { bg: 'rgba(40,40,40,0.85)', border: '#90a4ae', text: '#90a4ae', badge: 'UTL', badgeBg: '#2a2a2a' },
  filter:    { bg: 'rgba(20,45,50,0.85)', border: '#26c6da', text: '#26c6da', badge: 'FLT', badgeBg: '#0a3038' },
};

const PORT_COLORS = {
  image: '#4fc3f7',
  depth: '#ab47bc',
  camera_info: '#78909c',
  pointcloud: '#66bb6a',
  detections: '#ffa726',
  audio: '#ef5350',
  any: '#bdbdbd',
};

const STATUS_COLORS = {
  external: '#29b6f6',
  stopped: '#555',
  running: '#00e676',
  error: '#ff5252',
};

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let ws = null;
let templates = {};
let containerTemplates = {};
let portCompat = {};
let nodes = [];       // Graph nodes for rendering
let edges = [];       // Connection edges
let nodeMap = {};     // id -> node

// Pipeline data
let pipelineNodes = [];  // Serializable pipeline node data
let pipelineContainers = []; // Serializable pipeline container data
let currentPipeline = '';
let pipelineSystem = {
  camera_start_delay: 2.0,
  default_start_delay: 0.5,
  container_start_delay: 1.0,
};
let pipelineExtras = {};
let pipelineList = [];
let builtinList = [];
let pipelineDir = '~/.fluent_vision/pipelines';
let dirty = false;

// Interaction state
let panX = 0, panY = 0, zoom = 1;
let dragging = null;     // {node, offX, offY}
let panning = false;
let panStart = {x:0, y:0, px:0, py:0};
let wiring = null;       // {sourceNode, sourcePort, sourceIdx, mx, my}
let resizing = null;     // {node, startW, startX}
let hoverNode = null;
let hoverPort = null;
let selectedNode = null;
let nodeStatuses = {};
let containerStatuses = {};
let selectedContainerId = '';

// Animation
let animating = false;
let dpr = 1;

// Preview images
let previewImages = {};    // topic -> Image
let nodePreviewTopic = {}; // nodeId -> topic (which topic is subscribed for this node)
const PREVIEW_H = 120;     // Height reserved for preview image in node

// Log state
let logCollapsed = true;
let logCount = 0;
const LOG_MAX = 500;

// ---------------------------------------------------------------------------
// Log panel
// ---------------------------------------------------------------------------
function logTime() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}.${String(d.getMilliseconds()).padStart(3,'0')}`;
}

function addLog(level, badge, message) {
  const body = document.getElementById('logBody');
  if (!body) return;

  const entry = document.createElement('div');
  entry.className = `log-entry log-${level}`;

  let badgeHtml = '';
  if (badge) {
    badgeHtml = `<span class="log-badge ${badge}">${badge.toUpperCase()}</span>`;
  }

  entry.innerHTML = `<span class="log-time">${logTime()}</span>${badgeHtml}${escapeHtml(message)}`;
  body.appendChild(entry);

  // Trim old entries
  while (body.children.length > LOG_MAX) {
    body.removeChild(body.firstChild);
  }

  // Auto-expand on important logs
  if (logCollapsed && (level === 'error' || badge === 'launch' || badge === 'stop')) {
    logCollapsed = false;
    document.getElementById('logPanel').classList.remove('collapsed');
  }

  // Auto-scroll
  body.scrollTop = body.scrollHeight;

  // Update count
  logCount++;
  const countEl = document.getElementById('logCount');
  if (countEl) countEl.textContent = logCount;
}

function escapeHtml(str) {
  str = String(str ?? '');
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function copyLog() {
  const body = document.getElementById('logBody');
  if (!body) return;
  const lines = [];
  for (const entry of body.children) {
    lines.push(entry.textContent);
  }
  const text = lines.join('\n');
  // Fallback for non-HTTPS contexts
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  toast('Log copied');
}

function clearLog() {
  const body = document.getElementById('logBody');
  if (body) body.innerHTML = '';
  logCount = 0;
  const countEl = document.getElementById('logCount');
  if (countEl) countEl.textContent = '0';
}

function toggleLogPanel() {
  const panel = document.getElementById('logPanel');
  logCollapsed = !logCollapsed;
  panel.classList.toggle('collapsed', logCollapsed);
}

function resizeCanvas() {
  const wrap = document.getElementById('canvasWrap');
  dpr = window.devicePixelRatio || 1;
  canvas.width = wrap.clientWidth * dpr;
  canvas.height = wrap.clientHeight * dpr;
  canvas.style.width = wrap.clientWidth + 'px';
  canvas.style.height = wrap.clientHeight + 'px';

}
