// WebSocket
// ---------------------------------------------------------------------------
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const url = `${proto}://${location.host}/ws`;
  ws = new WebSocket(url);

  ws.onopen = () => {
    console.log('[WS] Connected');
    addLog('success', 'ws', 'WebSocket connected');
    wsSend({ type: 'get_templates' });
    wsSend({ type: 'list_pipelines' });
    refreshContainerStatuses();
  };

  ws.onmessage = (evt) => {
    if (typeof evt.data === 'string') {
      const msg = JSON.parse(evt.data);
      handleWSMessage(msg);
    } else if (evt.data instanceof Blob) {
      handleBinaryPreview(evt.data);
    }
  };

  ws.onclose = () => {
    console.log('[WS] Disconnected, reconnecting in 2s...');
    addLog('warn', 'ws', 'WebSocket disconnected, reconnecting in 2s...');
    setTimeout(connectWS, 2000);
  };

  ws.onerror = (e) => {
    console.error('[WS] Error:', e);
    addLog('error', 'ws', 'WebSocket error');
  };
}

function wsSend(msg) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(msg));
  }
}

function handleWSMessage(msg) {
  switch (msg.type) {
    case 'templates':
      templates = msg.templates || {};
      containerTemplates = msg.container_templates || {};
      portCompat = msg.port_compat || {};
      for (const k of Object.keys(templates)) {
        delete templates[k]._manifest_path;
      }
      for (const k of Object.keys(containerTemplates)) {
        delete containerTemplates[k]._manifest_path;
      }
      addLog('info', 'ws', `Loaded ${Object.keys(templates).length} node templates`);
      addLog('info', 'ws', `Loaded ${Object.keys(containerTemplates).length} container templates`);
      renderDockerPanel();
      if (pipelineNodes.length > 0) buildGraph();
      break;

    case 'pipeline_list':
      pipelineDir = msg.dir || pipelineDir;
      pipelineList = msg.pipelines || [];
      builtinList = msg.builtin || [];
      updatePipelineSelect();
      document.getElementById('pipelineDir').textContent = pipelineDir;
      addLog('info', 'ws', `Pipelines: ${pipelineList.length} user, ${builtinList.length} builtin`);
      break;

    case 'pipeline_data':
      addLog('info', 'ws', `Pipeline loaded: "${msg.name}" (${(msg.pipeline.nodes||[]).length} nodes)`);
      loadPipelineData(msg.name, msg.pipeline, msg.builtin);
      break;

    case 'save_result':
      if (msg.success) {
        addLog('success', 'save', `Saved: ${msg.name}`);
        toast(`Saved: ${msg.name}`);
        dirty = false;
        wsSend({ type: 'list_pipelines' });
      } else {
        addLog('error', 'save', `Save failed: ${msg.message || ''}`);
        toast('Save failed: ' + (msg.message || ''), true);
      }
      break;

    case 'delete_result':
      if (msg.success) {
        addLog('info', 'save', `Deleted: ${msg.name}`);
        toast(`Deleted: ${msg.name}`);
        wsSend({ type: 'list_pipelines' });
        clearCanvas();
      }
      break;

    case 'launch_result':
      if (msg.success) {
        nodeStatuses[msg.node_id] = 'running';
        addLog('success', 'launch', `${msg.node_id} → running (PID: ${msg.pid || '?'})`);
        subscribeNodePreview(msg.node_id);
      } else {
        nodeStatuses[msg.node_id] = 'error';
        addLog('error', 'launch', `${msg.node_id} → FAILED: ${msg.message || 'unknown error'}`);
      }
      render();
      break;

    case 'stop_result':
      if (msg.success) {
        nodeStatuses[msg.node_id] = 'stopped';
        addLog('info', 'stop', `${msg.node_id} → stopped`);
        unsubscribeNodePreview(msg.node_id);
      }
      render();
      break;

    case 'node_status':
      nodeStatuses[msg.node_id] = msg.status;
      if (msg.status === 'error') {
        const detail = msg.message || '';
        addLog('error', 'status', `${msg.node_id} → crashed${detail ? ': ' + detail : ''}`);
        unsubscribeNodePreview(msg.node_id);
      } else if (msg.status === 'stopped') {
        addLog('info', 'status', `${msg.node_id} → stopped`);
        unsubscribeNodePreview(msg.node_id);
      }
      render();
      break;

    case 'launch_pipeline_result':
      addLog('success', 'launch', `Pipeline launched: ${(msg.launched||[]).length} nodes [${(msg.launched||[]).join(', ')}]`);
      if ((msg.launched_containers || []).length) {
        addLog('success', 'launch', `Containers launched: ${(msg.launched_containers || []).join(', ')}`);
      }
      toast(`Launched ${(msg.launched||[]).length} nodes`);
      break;

    case 'stop_pipeline_result':
      addLog('info', 'stop', `Pipeline stopped: ${(msg.stopped||[]).length} nodes`);
      if ((msg.stopped_containers||[]).length) {
        addLog('info', 'stop', `Containers stopped: ${(msg.stopped_containers||[]).join(', ')}`);
      }
      toast(`Stopped ${(msg.stopped||[]).length} nodes`);
      // Unsubscribe all previews
      for (const nodeId of Object.keys(nodePreviewTopic)) {
        unsubscribeNodePreview(nodeId);
      }
      break;

    case 'statuses':
      nodeStatuses = msg.statuses || {};
      // Re-subscribe previews for running nodes (only if not already subscribed)
      for (const [nid, st] of Object.entries(nodeStatuses)) {
        if (st === 'running' && !nodePreviewTopic[nid]) subscribeNodePreview(nid);
      }
      render();
      break;

    case 'container_launch_result':
      if (msg.success) {
        containerStatuses[msg.container_id] = {
          status: msg.status || 'running',
          health: msg.health || '',
          container_name: msg.container_name || '',
        };
        addLog('success', 'launch', `${msg.container_id} → ${msg.status || 'running'}`);
      } else {
        addLog('error', 'launch', `${msg.container_id} → FAILED: ${msg.message || 'unknown error'}`);
      }
      renderDockerPanel();
      break;

    case 'container_stop_result':
      if (msg.success) {
        containerStatuses[msg.container_id] = {
          status: 'stopped',
          health: '',
        };
        addLog('info', 'stop', `${msg.container_id} → stopped`);
      }
      renderDockerPanel();
      break;

    case 'container_status':
      containerStatuses[msg.container_id] = {
        ...(containerStatuses[msg.container_id] || {}),
        status: msg.status,
        health: msg.health || '',
      };
      renderDockerPanel();
      break;

    case 'container_statuses':
      containerStatuses = msg.statuses || {};
      renderDockerPanel();
      break;

    case 'container_logs':
      if (msg.success) {
        addLog('info', 'status', `[${msg.container_id}] logs\n${msg.logs || ''}`);
      } else {
        addLog('error', 'status', `[${msg.container_id}] log fetch failed: ${msg.message || ''}`);
      }
      break;

    case 'error':
      addLog('error', 'error', msg.message || 'Unknown error');
      toast(msg.message || 'Error', true);
      break;
  }
}

function subscribeNodePreview(nodeId) {
  const gn = nodeMap[nodeId];
  if (!gn) return;

  // Find first image/depth output to use as preview
  for (const out of gn.outputs) {
    if (out.type === 'image' || out.type === 'depth') {
      const topic = resolveOutputTopic(gn, out);
      if (topic) {
        nodePreviewTopic[nodeId] = topic;
        wsSend({ type: 'subscribe_preview', topic: topic });
        return;
      }
    }
  }
}

function openDockerPanel() {
  document.getElementById('dockerPanel').classList.add('open');
  refreshContainerStatuses();
  renderDockerTemplateOptions();
  if (!selectedContainerId && pipelineContainers.length > 0) {
    selectedContainerId = pipelineContainers[0].id;
  }
  renderDockerPanel();
}

function closeDockerPanel() {
  document.getElementById('dockerPanel').classList.remove('open');
}

function dockerStatusClass(status) {
  return `docker-status-${(status || 'unknown').toLowerCase()}`;
}

function refreshContainerStatuses() {
  wsSend({
    type: 'get_container_statuses',
    containers: pipelineContainers.map(c => ({
      id: c.id,
      template: c.template,
      parameters: cloneJson(c.parameters || {}),
    })),
  });
}

function renderDockerTemplateOptions() {
  const selects = [
    document.getElementById('dockerTemplateSelect'),
    document.getElementById('dockerEditTemplate'),
  ];
  const keys = Object.keys(containerTemplates).sort();
  for (const sel of selects) {
    if (!sel) continue;
    const current = sel.value;
    sel.innerHTML = keys.map((key) => {
      const tmpl = containerTemplates[key] || {};
      return `<option value="${escapeHtml(key)}">${escapeHtml(tmpl.label || key)}</option>`;
    }).join('');
    if (current && keys.includes(current)) {
      sel.value = current;
    } else if (keys.length) {
      sel.value = keys[0];
    }
  }
}

function cloneJson(obj) {
  return JSON.parse(JSON.stringify(obj || {}));
}

function getPipelineContainer(containerId) {
  return pipelineContainers.find(c => c.id === containerId) || null;
}

function defaultContainerIdFromTemplate(templateKey) {
  let idx = 1;
  let candidate = `${templateKey}_${idx}`;
  while (getPipelineContainer(candidate)) {
    idx += 1;
    candidate = `${templateKey}_${idx}`;
  }
  return candidate;
}

function selectContainer(containerId) {
  selectedContainerId = containerId || '';
  const item = getPipelineContainer(selectedContainerId);
  const idEl = document.getElementById('dockerEditId');
  const tmplEl = document.getElementById('dockerEditTemplate');
  const paramsEl = document.getElementById('dockerEditParams');
  if (!item) {
    idEl.value = '';
    if (tmplEl.options.length > 0) tmplEl.selectedIndex = 0;
    const templateKey = tmplEl.value;
    const tmpl = containerTemplates[templateKey] || {};
    paramsEl.value = JSON.stringify(cloneJson(tmpl.default_parameters || {}), null, 2);
    renderDockerPanel();
    return;
  }
  idEl.value = item.id || '';
  tmplEl.value = item.template || '';
  paramsEl.value = JSON.stringify(cloneJson(item.parameters || {}), null, 2);
  renderDockerPanel();
}

function addContainerToPipeline() {
  const templateKey = document.getElementById('dockerTemplateSelect').value;
  const tmpl = containerTemplates[templateKey];
  if (!tmpl) return;
  const containerId = defaultContainerIdFromTemplate(templateKey);
  pipelineContainers.push({
    id: containerId,
    enable: true,
    template: templateKey,
    parameters: cloneJson(tmpl.default_parameters || {}),
  });
  markDirty();
  selectContainer(containerId);
}

function applyContainerEdit() {
  const idEl = document.getElementById('dockerEditId');
  const tmplEl = document.getElementById('dockerEditTemplate');
  const paramsEl = document.getElementById('dockerEditParams');
  const containerId = (idEl.value || '').trim();
  const templateKey = (tmplEl.value || '').trim();
  if (!containerId) {
    toast('Container ID is required', true);
    return false;
  }
  if (!templateKey || !containerTemplates[templateKey]) {
    toast('Template is required', true);
    return false;
  }

  let params = {};
  try {
    params = paramsEl.value.trim() ? JSON.parse(paramsEl.value) : {};
  } catch (err) {
    toast('Invalid container JSON: ' + err.message, true);
    return false;
  }

  const existingIdx = pipelineContainers.findIndex(c => c.id === selectedContainerId);
  const duplicateIdx = pipelineContainers.findIndex(c => c.id === containerId);
  if (duplicateIdx >= 0 && duplicateIdx !== existingIdx) {
    toast('Container ID already exists in pipeline', true);
    return false;
  }

  const nextItem = {
    id: containerId,
    enable: true,
    template: templateKey,
    parameters: params,
  };

  if (existingIdx >= 0) {
    pipelineContainers[existingIdx] = nextItem;
  } else {
    pipelineContainers.push(nextItem);
  }
  selectedContainerId = containerId;
  markDirty();
  renderDockerPanel();
  return true;
}

function removeSelectedContainer() {
  if (!selectedContainerId) return;
  pipelineContainers = pipelineContainers.filter(c => c.id !== selectedContainerId);
  delete containerStatuses[selectedContainerId];
  selectedContainerId = '';
  markDirty();
  selectContainer('');
}

function launchContainer(containerId) {
  const item = getPipelineContainer(containerId);
  if (!item) {
    const tmpl = containerTemplates[containerId];
    if (!tmpl) return;
    wsSend({
      type: 'launch_container',
      container_id: containerId,
      template_key: containerId,
      parameters: cloneJson(tmpl.default_parameters || {}),
    });
    return;
  }
  wsSend({
    type: 'launch_container',
    container_id: item.id,
    template_key: item.template,
    parameters: cloneJson(item.parameters || {}),
  });
}

function stopContainer(containerId) {
  const item = getPipelineContainer(containerId);
  wsSend({
    type: 'stop_container',
    container_id: containerId,
    template_key: item ? item.template : containerId,
    parameters: item ? cloneJson(item.parameters || {}) : cloneJson((containerTemplates[containerId] || {}).default_parameters || {}),
  });
}

function fetchContainerLogs(containerId) {
  const item = getPipelineContainer(containerId);
  wsSend({
    type: 'get_container_logs',
    container_id: containerId,
    template_key: item ? item.template : containerId,
    parameters: item ? cloneJson(item.parameters || {}) : cloneJson((containerTemplates[containerId] || {}).default_parameters || {}),
  });
}

function containerStatusMetrics() {
  let running = 0;
  let healthy = 0;
  let error = 0;
  for (const item of pipelineContainers) {
    const st = containerStatuses[item.id] || {};
    const status = (st.status || 'stopped').toLowerCase();
    const health = (st.health || '').toLowerCase();
    if (status === 'running') running += 1;
    if (health === 'healthy') healthy += 1;
    if (status === 'error' || status === 'exited' || health === 'unhealthy') error += 1;
  }
  return {
    total: pipelineContainers.length,
    running,
    healthy,
    error,
  };
}

function updateDockerToolbarBadge() {
  const metrics = containerStatusMetrics();
  const count = document.getElementById('dockerToolbarCount');
  const btn = document.getElementById('btnDocker');
  if (count) count.textContent = `${metrics.running}/${metrics.total}`;
  if (btn) btn.classList.toggle('has-running', metrics.running > 0);
}

function renderDockerSummary() {
  const el = document.getElementById('dockerSummary');
  if (!el) return;
  const metrics = containerStatusMetrics();
  el.innerHTML = [
    ['Configured', metrics.total],
    ['Running', metrics.running],
    ['Healthy', metrics.healthy],
    ['Needs Attention', metrics.error],
  ].map(([label, value]) => `
    <div class="docker-metric">
      <div class="docker-metric-value">${escapeHtml(value)}</div>
      <div class="docker-metric-label">${escapeHtml(label)}</div>
    </div>
  `).join('');
  updateDockerToolbarBadge();
}

function renderDockerTemplateGrid() {
  const grid = document.getElementById('dockerTemplateGrid');
  if (!grid) return;
  const keys = Object.keys(containerTemplates).sort();
  if (!keys.length) {
    grid.innerHTML = '<div class="docker-empty">No runtime templates loaded.</div>';
    return;
  }
  grid.innerHTML = keys.map((key) => {
    const tmpl = containerTemplates[key] || {};
    const params = tmpl.default_parameters || {};
    const gpu = params.gpu ? 'GPU' : 'CPU';
    const net = params.network_host ? 'host network' : 'mapped ports';
    const image = params.image || tmpl.image || '';
    return `
      <div class="docker-template-card" onclick="addDefaultContainerToPipeline(${JSON.stringify(key)})">
        <div class="docker-template-title">
          <strong>${escapeHtml(tmpl.label || key)}</strong>
          <span>${escapeHtml(gpu)}</span>
        </div>
        <div class="docker-template-meta">${escapeHtml(net)}<br>${escapeHtml(image)}</div>
      </div>
    `;
  }).join('');
}

function renderDockerPanel() {
  const list = document.getElementById('dockerList');
  if (!list) return;
  renderDockerSummary();
  renderDockerTemplateGrid();

  if (!selectedContainerId && pipelineContainers.length > 0) {
    selectedContainerId = pipelineContainers[0].id;
  }

  if (Object.keys(containerTemplates).length === 0) {
    list.innerHTML = '<div class="docker-empty">No container templates loaded.</div>';
    return;
  }

  renderDockerTemplateOptions();

  if (pipelineContainers.length === 0) {
    list.innerHTML = '<div class="docker-empty">No containers saved in this pipeline yet.</div>';
  } else {
    const html = pipelineContainers.map((item) => {
      const tmpl = containerTemplates[item.template] || {};
      const st = containerStatuses[item.id] || {};
      const defaultParams = tmpl.default_parameters || {};
      const merged = { ...cloneJson(defaultParams), ...cloneJson(item.parameters || {}) };
      const status = st.status || 'stopped';
      const health = st.health ? ` / ${st.health}` : '';
      const image = (merged.image || tmpl.image || '').toString();
      const containerName = (st.container_name || merged.container_name || item.id).toString();
      const network = merged.network_host ? 'net=host' : 'ports';
      const gpu = merged.gpu ? 'gpu=all' : 'gpu=off';
      const selectedClass = item.id === selectedContainerId ? ' selected' : '';
      return `
        <div class="docker-item${selectedClass}" onclick="selectContainer(${JSON.stringify(item.id)})">
          <div class="docker-item-title">
            <strong>${escapeHtml(item.id)}</strong>
            <span class="${dockerStatusClass(status)}">${escapeHtml(status + health)}</span>
          </div>
          <div class="docker-item-meta">${escapeHtml(tmpl.label || item.template)}<br>${escapeHtml(containerName)}<br>${escapeHtml(image)}</div>
          <div class="docker-item-detail">
            <span class="docker-chip">${escapeHtml(gpu)}</span>
            <span class="docker-chip">${escapeHtml(network)}</span>
          </div>
          <div class="docker-item-row">
            <button onclick="event.stopPropagation(); launchContainer(${JSON.stringify(item.id)})">Start</button>
            <button onclick="event.stopPropagation(); stopContainer(${JSON.stringify(item.id)})">Stop</button>
            <button onclick="event.stopPropagation(); fetchContainerLogs(${JSON.stringify(item.id)})">Logs</button>
          </div>
        </div>
      `;
    }).join('');
    list.innerHTML = html;
  }

  const item = getPipelineContainer(selectedContainerId);
  const idEl = document.getElementById('dockerEditId');
  const tmplEl = document.getElementById('dockerEditTemplate');
  const paramsEl = document.getElementById('dockerEditParams');
  if (item) {
    idEl.value = item.id || '';
    tmplEl.value = item.template || tmplEl.value;
    paramsEl.value = JSON.stringify(cloneJson(item.parameters || {}), null, 2);
  } else if (!idEl.value) {
    paramsEl.value = paramsEl.value || JSON.stringify(cloneJson((containerTemplates[tmplEl.value] || {}).default_parameters || {}), null, 2);
  }
}

function updateDockerEditorTemplate() {
  const tmplEl = document.getElementById('dockerEditTemplate');
  const paramsEl = document.getElementById('dockerEditParams');
  const templateKey = tmplEl.value;
  if (selectedContainerId && getPipelineContainer(selectedContainerId)) return;
  paramsEl.value = JSON.stringify(cloneJson((containerTemplates[templateKey] || {}).default_parameters || {}), null, 2);
}

function startSelectedContainer() {
  if (!applyContainerEdit()) return;
  launchContainer(selectedContainerId);
}

function stopSelectedContainer() {
  if (!selectedContainerId) return;
  stopContainer(selectedContainerId);
}

function fetchSelectedContainerLogs() {
  if (!selectedContainerId) return;
  fetchContainerLogs(selectedContainerId);
}

function addDefaultContainerToPipeline(templateKey) {
  const tmpl = containerTemplates[templateKey] || {};
  const containerId = defaultContainerIdFromTemplate(templateKey);
  pipelineContainers.push({
    id: containerId,
    enable: true,
    template: templateKey,
    parameters: cloneJson(tmpl.default_parameters || {}),
  });
  markDirty();
  selectContainer(containerId);
}

function renderDockerPanelLegacyTemplates() {
  const keys = Object.keys(containerTemplates).sort();
  return keys.map((key) => {
    const tmpl = containerTemplates[key] || {};
    const st = containerStatuses[key] || {};
    const status = st.status || 'stopped';
    const health = st.health ? ` / ${st.health}` : '';
    const image = (tmpl.image || (tmpl.default_parameters || {}).image || '').toString();
    const containerName = (st.container_name || (tmpl.default_parameters || {}).container_name || key).toString();
    return `
      <div class="docker-item">
        <div class="docker-item-title">
          <strong>${escapeHtml(tmpl.label || key)}</strong>
          <span class="${dockerStatusClass(status)}">${escapeHtml(status + health)}</span>
        </div>
        <div class="docker-item-meta">${escapeHtml(containerName)}<br>${escapeHtml(image)}</div>
        <div class="docker-item-row">
          <button onclick="event.stopPropagation(); addDefaultContainerToPipeline('${key}')">Add to Pipeline</button>
          <button onclick="event.stopPropagation(); launchContainer('${key}')">Quick Start</button>
          <button onclick="event.stopPropagation(); fetchContainerLogs('${key}')">Logs</button>
        </div>
      </div>
    `;
  }).join('');
}

function unsubscribeNodePreview(nodeId) {
  const topic = nodePreviewTopic[nodeId];
  if (topic) {
    wsSend({ type: 'unsubscribe_preview', topic: topic });
    delete nodePreviewTopic[nodeId];
    if (previewImages[topic]) {
      URL.revokeObjectURL(previewImages[topic].src);
      delete previewImages[topic];
    }
  }
}

function handleBinaryPreview(blob) {
  // Binary format: topic\0jpeg_data
  blob.arrayBuffer().then(buf => {
    const bytes = new Uint8Array(buf);
    const nullIdx = bytes.indexOf(0);
    if (nullIdx < 0) return;
    const topic = new TextDecoder().decode(bytes.slice(0, nullIdx));
    const jpegBlob = new Blob([bytes.slice(nullIdx + 1)], {type:'image/jpeg'});
    const url = URL.createObjectURL(jpegBlob);
    const img = new Image();
    img.onload = () => {
      if (previewImages[topic]) {
        URL.revokeObjectURL(previewImages[topic].src);
      }
      previewImages[topic] = img;
      render();
    };
    img.src = url;
  });
}

// ---------------------------------------------------------------------------
// Pipeline management
// ---------------------------------------------------------------------------
function updatePipelineSelect() {
  const sel = document.getElementById('pipelineSelect');
  sel.innerHTML = '<option value="">-- none --</option>';

  if (builtinList.length > 0) {
    const grp = document.createElement('optgroup');
    grp.label = 'Built-in';
    for (const name of builtinList) {
      const opt = document.createElement('option');
      opt.value = 'builtin:' + name;
      opt.textContent = name;
      grp.appendChild(opt);
    }
    sel.appendChild(grp);
  }

  if (pipelineList.length > 0) {
    const grp = document.createElement('optgroup');
    grp.label = 'My Pipelines';
    for (const name of pipelineList) {
      const opt = document.createElement('option');
      opt.value = 'user:' + name;
      opt.textContent = name;
      grp.appendChild(opt);
    }
    sel.appendChild(grp);
  }

  // Restore selection
  if (currentPipeline) {
    for (const opt of sel.options) {
      if (opt.value.endsWith(':' + currentPipeline)) {
        opt.selected = true;
        break;
      }
    }
  }
}

function loadPipelineData(name, data, isBuiltin) {
  currentPipeline = name;
  pipelineNodes = data.nodes || [];
  pipelineContainers = data.containers || [];
  pipelineSystem = cloneJson(data.system || pipelineSystem);
  pipelineExtras = cloneJson(data || {});
  delete pipelineExtras.name;
  delete pipelineExtras.system;
  delete pipelineExtras.containers;
  delete pipelineExtras.nodes;
  delete pipelineExtras.layout;
  selectedContainerId = pipelineContainers.length > 0 ? pipelineContainers[0].id : '';
  dirty = false;

  // Restore layout positions
  const layout = data.layout || {};
  for (const pn of pipelineNodes) {
    if (layout[pn.id]) {
      pn._x = layout[pn.id].x;
      pn._y = layout[pn.id].y;
      pn._width = layout[pn.id].width;
    }
  }

  buildGraph();
  autoFitView();
  renderDockerPanel();
  toast(`Loaded: ${name}${isBuiltin ? ' (builtin)' : ''}`);
}

function buildPipelineData() {
  // Build saveable pipeline data from current state
  const layout = {};
  for (const n of nodes) {
    layout[n.id] = { x: Math.round(n.x), y: Math.round(n.y), width: Math.round(n.width) };
  }

  // Sync parameters from node state
  for (const pn of pipelineNodes) {
    const gn = nodeMap[pn.id];
    if (gn) {
      pn.parameters = gn.parameters;
      pn.node_name = gn.node_name;
      pn.namespace = gn.namespace;
    }
  }

  return {
    ...cloneJson(pipelineExtras),
    name: currentPipeline || 'Untitled',
    system: cloneJson(pipelineSystem),
    containers: pipelineContainers,
    nodes: pipelineNodes.filter(pn => !pn._isTopicSource),
    layout: layout,
  };
}

// ---------------------------------------------------------------------------
// Graph building
// ---------------------------------------------------------------------------
function buildGraph() {
  nodes = [];
  edges = [];
  nodeMap = {};

  let x = 100, y = 100;

  for (const pn of pipelineNodes) {
    const tmpl = templates[pn._template] || null;
    const isTopicSource = pn._isTopicSource || false;

    const inputs = isTopicSource ? (pn._inputs || []) :
                   (tmpl ? tmpl.inputs : inferPorts(pn, 'input'));
    const outputs = isTopicSource ? (pn._outputs || []) :
                    (tmpl ? tmpl.outputs : inferPorts(pn, 'output'));

    const category = tmpl ? tmpl.category :
                     (isTopicSource ? 'sensor' : 'ai');
    const label = tmpl ? tmpl.label : (pn.node_name || pn.id);

    const portRows = Math.max(inputs.length, outputs.length);
    const nodeW = pn._width || NODE_DEFAULT_W;
    const hasPreview = !!nodePreviewTopic[pn.id];
    const nodeH = HEADER_H + portRows * PORT_H + (hasPreview ? PREVIEW_H : 0) + FOOTER_H + PAD;

    const gn = {
      id: pn.id,
      label: label,
      category: category,
      inputs: inputs,
      outputs: outputs,
      node_name: pn.node_name || '',
      namespace: pn.namespace || '',
      parameters: pn.parameters || {},
      package: pn.package || '',
      exec: pn.exec || '',
      _template: pn._template || '',
      _isTopicSource: isTopicSource,
      _externalSource: pn._externalSource || false,
      x: pn._x || x,
      y: pn._y || y,
      width: nodeW,
      height: nodeH,
      status: nodeStatuses[pn.id] || (isTopicSource ? 'external' : 'stopped'),
    };

    nodes.push(gn);
    nodeMap[gn.id] = gn;

    // Advance default position
    if (!pn._x) {
      x += nodeW + 60;
      if (x > 1000) { x = 100; y += 250; }
    }
  }

  buildEdges();
  render();
}

function inferPorts(pn, side) {
  // Fallback: infer ports from parameter names
  const ports = [];
  const params = pn.parameters || {};
  for (const key of Object.keys(params)) {
    const lk = key.toLowerCase();
    if (side === 'input' && (lk.includes('input') || lk.startsWith('color_topic') ||
        lk.startsWith('depth_topic') || lk.startsWith('camera_info_topic'))) {
      ports.push({ param: key, type: guessPortType(key) });
    }
    if (side === 'output' && (lk.includes('output') || lk.includes('overlay') ||
        lk.includes('mask') || lk.includes('filtered'))) {
      ports.push({ param: key, type: guessPortType(key) });
    }
  }
  return ports;
}

function guessPortType(paramName) {
  const lk = paramName.toLowerCase();
  if (lk.includes('depth')) return 'depth';
  if (lk.includes('camera_info')) return 'camera_info';
  if (lk.includes('pointcloud') || lk.includes('points')) return 'pointcloud';
  if (lk.includes('detection')) return 'detections';
  if (lk.includes('audio')) return 'audio';
  return 'image';
}

function buildEdges() {
  edges = [];

  // Build topic -> {nodeId, portIdx} map from outputs
  const outputTopicMap = {};
  for (const gn of nodes) {
    for (let i = 0; i < gn.outputs.length; i++) {
      const topic = resolveOutputTopic(gn, gn.outputs[i]);
      if (topic) outputTopicMap[topic] = { nodeId: gn.id, portIdx: i };
    }
  }

  // Match inputs to outputs
  for (const gn of nodes) {
    for (let i = 0; i < gn.inputs.length; i++) {
      const port = gn.inputs[i];
      const paramValue = getNestedParam(gn.parameters, port.param);
      if (!paramValue) continue;

      const src = outputTopicMap[paramValue];
      if (src && src.nodeId !== gn.id) {
        edges.push({
          sourceNodeId: src.nodeId,
          sourcePortIdx: src.portIdx,
          targetNodeId: gn.id,
          targetPortIdx: i,
        });
      }
    }
  }
}

function resolveOutputTopic(node, port) {
  // 1. Check node parameters
  let paramValue = getNestedParam(node.parameters, port.param);

  // 2. Fallback to template default_parameters
  if (!paramValue && node._template && templates[node._template]) {
    const defParams = templates[node._template].default_parameters || {};
    paramValue = getNestedParam(defParams, port.param);
  }

  // Absolute path — return as-is
  if (paramValue && paramValue.startsWith('/')) return paramValue;

  // Relative path — construct namespace/node_name/value
  if (paramValue) {
    const ns = node.namespace || '';
    const nn = node.node_name || node.id;
    // Handle ROS2 ~/ prefix (resolves to namespace/node_name/)
    if (paramValue.startsWith('~/')) {
      const suffix = paramValue.slice(2);
      return `${ns}/${nn}/${suffix}`.replace(/\/+/g, '/');
    }
    return `${ns}/${nn}/${paramValue}`.replace(/\/+/g, '/');
  }

  // Last resort — use param path as topic path
  const ns = node.namespace || '';
  const nn = node.node_name || node.id;
  const paramPath = port.param.replace(/\./g, '/');
  return `${ns}/${nn}/${paramPath}`.replace(/\/+/g, '/');
}

function getNestedParam(params, path) {
  const parts = path.split('.');
  let obj = params;
  for (const p of parts) {
    if (obj == null || typeof obj !== 'object') return '';
    obj = obj[p];
  }
  return obj != null ? String(obj) : '';
}

function setNestedParam(params, path, value) {
  const parts = path.split('.');
  let obj = params;
  for (let i = 0; i < parts.length - 1; i++) {
    if (!(parts[i] in obj) || typeof obj[parts[i]] !== 'object') {
      obj[parts[i]] = {};
    }
    obj = obj[parts[i]];
  }
  obj[parts[parts.length - 1]] = value;
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);

  // Recalculate node heights (preview may have appeared/disappeared)
  for (const n of nodes) {
    const portRows = Math.max(n.inputs.length, n.outputs.length);
    const hasPreview = !!nodePreviewTopic[n.id];
    n.height = HEADER_H + portRows * PORT_H + (hasPreview ? PREVIEW_H : 0) + FOOTER_H + PAD;
  }

  ctx.save();
  ctx.translate(panX, panY);
  ctx.scale(zoom, zoom);

  // Grid
  drawGrid();

  // Edges
  drawEdges();

  // Nodes
  for (const n of nodes) drawNode(n);

  // Ports
  for (const n of nodes) drawPorts(n);

  // Wiring preview
  if (wiring) drawWiringPreview();

  ctx.restore();
}

function drawGrid() {
  const step = 40;
  const w = canvas.width / dpr / zoom + Math.abs(panX / zoom);
  const h = canvas.height / dpr / zoom + Math.abs(panY / zoom);
  const offX = -panX / zoom;
  const offY = -panY / zoom;

  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;

  for (let x = Math.floor(offX / step) * step; x < offX + w; x += step) {
    ctx.beginPath(); ctx.moveTo(x, offY); ctx.lineTo(x, offY + h); ctx.stroke();
  }
  for (let y = Math.floor(offY / step) * step; y < offY + h; y += step) {
    ctx.beginPath(); ctx.moveTo(offX, y); ctx.lineTo(offX + w, y); ctx.stroke();
  }
}

function drawNode(n) {
  const c = COLORS[n.category] || COLORS.ai;
  const isHover = hoverNode === n;
  const isSelected = selectedNode === n;

  // Live status from nodeStatuses (not cached n.status)
  const liveStatus = nodeStatuses[n.id] || n.status || 'stopped';
  n.status = liveStatus;  // sync back

  // Shadow
  ctx.shadowColor = 'rgba(0,0,0,0.4)';
  ctx.shadowBlur = isHover ? 16 : 8;
  ctx.shadowOffsetY = 2;

  // Background
  ctx.fillStyle = c.bg;
  ctx.beginPath();
  roundRect(ctx, n.x, n.y, n.width, n.height, 6);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Border — highlight red on error, green on running
  let borderColor = isSelected ? '#fff' : (isHover ? c.border : 'rgba(255,255,255,0.15)');
  if (liveStatus === 'error') borderColor = '#ff5252';
  else if (liveStatus === 'running') borderColor = '#00e676';
  ctx.strokeStyle = borderColor;
  ctx.lineWidth = (isSelected || liveStatus === 'error' || liveStatus === 'running') ? 2 : 1;
  ctx.stroke();

  // Header line
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(n.x, n.y + HEADER_H);
  ctx.lineTo(n.x + n.width, n.y + HEADER_H);
  ctx.stroke();

  // Status dot
  const statusColor = STATUS_COLORS[liveStatus] || STATUS_COLORS.stopped;
  ctx.fillStyle = statusColor;
  ctx.beginPath();
  ctx.arc(n.x + 12, n.y + HEADER_H / 2, 4, 0, Math.PI * 2);
  ctx.fill();

  // Label
  ctx.fillStyle = c.text;
  ctx.font = 'bold 12px "Segoe UI", sans-serif';
  ctx.textBaseline = 'middle';
  const maxLabelW = n.width - 70;
  let label = n.label;
  if (ctx.measureText(label).width > maxLabelW) {
    while (label.length > 3 && ctx.measureText(label + '...').width > maxLabelW) {
      label = label.slice(0, -1);
    }
    label += '...';
  }
  ctx.fillText(label, n.x + 22, n.y + HEADER_H / 2);

  // Badge
  ctx.fillStyle = c.badgeBg;
  const badgeW = 32;
  const badgeX = n.x + n.width - badgeW - 6;
  const badgeY = n.y + 6;
  ctx.beginPath();
  roundRect(ctx, badgeX, badgeY, badgeW, 16, 3);
  ctx.fill();
  ctx.fillStyle = c.text;
  ctx.font = 'bold 9px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(c.badge, badgeX + badgeW / 2, badgeY + 9);
  ctx.textAlign = 'left';

  // Port labels
  ctx.font = '11px "Segoe UI", sans-serif';
  ctx.textBaseline = 'middle';

  for (let i = 0; i < n.inputs.length; i++) {
    const py = n.y + HEADER_H + i * PORT_H + PORT_H / 2;
    ctx.fillStyle = '#aaa';
    ctx.fillText(portLabel(n.inputs[i]), n.x + 14, py);
  }

  for (let i = 0; i < n.outputs.length; i++) {
    const py = n.y + HEADER_H + i * PORT_H + PORT_H / 2;
    const lbl = portLabel(n.outputs[i]);
    ctx.fillStyle = '#aaa';
    ctx.textAlign = 'right';
    ctx.fillText(lbl, n.x + n.width - 14, py);
    ctx.textAlign = 'left';
  }

  // Preview image
  const previewTopic = nodePreviewTopic[n.id];
  const previewImg = previewTopic ? previewImages[previewTopic] : null;
  if (previewImg) {
    const portRows = Math.max(n.inputs.length, n.outputs.length);
    const previewY = n.y + HEADER_H + portRows * PORT_H + 4;
    const previewW = n.width - 8;
    const previewH = PREVIEW_H - 8;
    const imgAspect = previewImg.width / previewImg.height;
    const boxAspect = previewW / previewH;
    let dw, dh, dx, dy;
    if (imgAspect > boxAspect) {
      dw = previewW; dh = previewW / imgAspect;
      dx = n.x + 4; dy = previewY + (previewH - dh) / 2;
    } else {
      dh = previewH; dw = previewH * imgAspect;
      dx = n.x + 4 + (previewW - dw) / 2; dy = previewY;
    }
    ctx.save();
    ctx.beginPath();
    roundRect(ctx, n.x + 4, previewY, previewW, previewH, 3);
    ctx.clip();
    ctx.drawImage(previewImg, dx, dy, dw, dh);
    ctx.restore();
  }

  // Node name (footer)
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.font = '10px monospace';
  const footerY = n.y + n.height - FOOTER_H / 2;
  ctx.fillText(n.node_name || n.id, n.x + 8, footerY);

  // Resize handle (bottom-right triangle)
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath();
  ctx.moveTo(n.x + n.width, n.y + n.height);
  ctx.lineTo(n.x + n.width - RESIZE_HANDLE, n.y + n.height);
  ctx.lineTo(n.x + n.width, n.y + n.height - RESIZE_HANDLE);
  ctx.closePath();
  ctx.fill();
}

function drawPorts(n) {
  for (let i = 0; i < n.inputs.length; i++) {
    const py = n.y + HEADER_H + i * PORT_H + PORT_H / 2;
    const color = PORT_COLORS[n.inputs[i].type] || PORT_COLORS.any;
    const isHov = hoverPort && hoverPort.node === n && hoverPort.side === 'input' && hoverPort.idx === i;
    drawPort(n.x, py, color, isHov);
  }

  for (let i = 0; i < n.outputs.length; i++) {
    const py = n.y + HEADER_H + i * PORT_H + PORT_H / 2;
    const color = PORT_COLORS[n.outputs[i].type] || PORT_COLORS.any;
    const isHov = hoverPort && hoverPort.node === n && hoverPort.side === 'output' && hoverPort.idx === i;
    drawPort(n.x + n.width, py, color, isHov);
  }
}

function drawPort(x, y, color, isHover) {
  const r = isHover ? PORT_R + 2 : PORT_R - 1;

  // Glow
  if (isHover) {
    ctx.shadowColor = color;
    ctx.shadowBlur = 10;
  }

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();

  // White outline
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.shadowBlur = 0;
}

function drawEdges() {
  for (const e of edges) {
    const srcNode = nodeMap[e.sourceNodeId];
    const tgtNode = nodeMap[e.targetNodeId];
    if (!srcNode || !tgtNode) continue;

    const sx = srcNode.x + srcNode.width;
    const sy = srcNode.y + HEADER_H + e.sourcePortIdx * PORT_H + PORT_H / 2;
    const tx = tgtNode.x;
    const ty = tgtNode.y + HEADER_H + e.targetPortIdx * PORT_H + PORT_H / 2;

    const srcPort = srcNode.outputs[e.sourcePortIdx];
    const color = srcPort ? (PORT_COLORS[srcPort.type] || PORT_COLORS.any) : '#888';

    drawBezier(sx, sy, tx, ty, color, 2);
  }
}

function drawBezier(sx, sy, tx, ty, color, lineW) {
  const dist = Math.abs(tx - sx);
  const cpOff = Math.max(60, dist * 0.4);

  ctx.strokeStyle = color;
  ctx.lineWidth = lineW;
  ctx.globalAlpha = 0.7;
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.bezierCurveTo(sx + cpOff, sy, tx - cpOff, ty, tx, ty);
  ctx.stroke();
  ctx.globalAlpha = 1.0;
}

function drawWiringPreview() {
  const srcNode = wiring.sourceNode;
  const sx = srcNode.x + srcNode.width;
  const sy = srcNode.y + HEADER_H + wiring.sourceIdx * PORT_H + PORT_H / 2;

  // Check hover target for color
  let color = '#888';
  const srcPort = srcNode.outputs[wiring.sourceIdx];
  if (srcPort) color = PORT_COLORS[srcPort.type] || '#888';

  if (hoverPort && hoverPort.side === 'input') {
    // Check compatibility
    const tgtType = hoverPort.node.inputs[hoverPort.idx].type;
    const srcType = srcPort ? srcPort.type : 'any';
    const compat = portCompat[tgtType] || [tgtType];
    if (!compat.includes(srcType) && tgtType !== 'any' && srcType !== 'any') {
      color = '#ff5252';  // Incompatible
    }
  }

  drawBezier(sx, sy, wiring.mx, wiring.my, color, 2.5);
}

function portLabel(port) {
  if (port.label) return port.label;
  let name = port.param;
  // "topics.color" -> "color"
  if (name.includes('.')) name = name.split('.').pop();
  // Remove _topic suffix
  name = name.replace(/_topic$/, '');
  return name;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
}

// ---------------------------------------------------------------------------
// Mouse & Touch interaction
// ---------------------------------------------------------------------------
function screenToWorld(sx, sy) {
  return {
    x: (sx - panX) / zoom,
    y: (sy - panY) / zoom,
  };
}

canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  const w = screenToWorld(sx, sy);

  // Check resize handle
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    const rx = n.x + n.width;
    const ry = n.y + n.height;
    if (w.x >= rx - RESIZE_HANDLE && w.x <= rx &&
        w.y >= ry - RESIZE_HANDLE && w.y <= ry) {
      resizing = { node: n, startW: n.width, startX: sx };
      return;
    }
  }

  // Check port (start wiring from output)
  const ph = portHitTest(w.x, w.y);
  if (ph && ph.side === 'output') {
    wiring = {
      sourceNode: ph.node,
      sourcePort: ph.node.outputs[ph.idx],
      sourceIdx: ph.idx,
      mx: w.x,
      my: w.y,
    };
    return;
  }

  // Check edge click (delete edge)
  const eh = edgeHitTest(w.x, w.y);
  if (eh !== null) {
    removeEdge(eh);
    return;
  }

  // Check node click
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (w.x >= n.x && w.x <= n.x + n.width &&
        w.y >= n.y && w.y <= n.y + n.height) {
      // Select
      selectedNode = n;
      // Start drag
      dragging = { node: n, offX: w.x - n.x, offY: w.y - n.y };
      // Move to top
      nodes.splice(i, 1);
      nodes.push(n);
      render();
      return;
    }
  }

  // Deselect
  selectedNode = null;
  closeEditPanel();

  // Pan
  panning = true;
  panStart = { x: sx, y: sy, px: panX, py: panY };
  render();
});

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  const w = screenToWorld(sx, sy);

  if (resizing) {
    const delta = (sx - resizing.startX) / zoom;
    resizing.node.width = Math.max(NODE_MIN_W,
      Math.min(NODE_MAX_W, resizing.startW + delta));
    markDirty();
    render();
    return;
  }

  if (wiring) {
    wiring.mx = w.x;
    wiring.my = w.y;
    // Update hover port
    hoverPort = portHitTest(w.x, w.y);
    render();
    return;
  }

  if (dragging) {
    dragging.node.x = w.x - dragging.offX;
    dragging.node.y = w.y - dragging.offY;
    markDirty();
    render();
    return;
  }

  if (panning) {
    panX = panStart.px + (sx - panStart.x);
    panY = panStart.py + (sy - panStart.y);
    render();
    return;
  }

  // Hover detection
  let newHoverNode = null;
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (w.x >= n.x && w.x <= n.x + n.width &&
        w.y >= n.y && w.y <= n.y + n.height) {
      newHoverNode = n;
      break;
    }
  }

  const newHoverPort = portHitTest(w.x, w.y);

  if (newHoverNode !== hoverNode || newHoverPort !== hoverPort) {
    hoverNode = newHoverNode;
    hoverPort = newHoverPort;
    // Update cursor
    canvas.style.cursor = hoverPort ? 'crosshair' :
                          (hoverNode ? 'grab' : 'default');
    render();
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (wiring && hoverPort && hoverPort.side === 'input') {
    // Complete wiring
    const srcNode = wiring.sourceNode;
    const srcPort = wiring.sourcePort;
    const tgtNode = hoverPort.node;
    const tgtPort = tgtNode.inputs[hoverPort.idx];

    // Check compatibility
    const srcType = srcPort.type || 'any';
    const tgtType = tgtPort.type || 'any';
    const compat = portCompat[tgtType] || [tgtType];
    if (compat.includes(srcType) || tgtType === 'any' || srcType === 'any') {
      // Set the input parameter to the resolved output topic
      const topic = resolveOutputTopic(srcNode, srcPort);
      setNestedParam(tgtNode.parameters, tgtPort.param, topic);

      // Also update pipeline node
      const pn = pipelineNodes.find(p => p.id === tgtNode.id);
      if (pn) setNestedParam(pn.parameters, tgtPort.param, topic);

      buildEdges();
      markDirty();
    }
  }

  wiring = null;
  dragging = null;
  panning = false;
  resizing = null;
  render();
});

canvas.addEventListener('dblclick', (e) => {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  const w = screenToWorld(sx, sy);

  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (w.x >= n.x && w.x <= n.x + n.width &&
        w.y >= n.y && w.y <= n.y + n.height) {
      selectedNode = n;
      openEditPanel(n);
      return;
    }
  }
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;

  const oldZoom = zoom;
  const delta = -e.deltaY * 0.001;
  zoom = Math.max(0.2, Math.min(3, zoom + delta));

  // Zoom toward cursor
  panX = sx - (sx - panX) * (zoom / oldZoom);
  panY = sy - (sy - panY) * (zoom / oldZoom);
  render();
}, { passive: false });

// ---------------------------------------------------------------------------
// Hit testing
// ---------------------------------------------------------------------------
function portHitTest(wx, wy) {
  for (let ni = nodes.length - 1; ni >= 0; ni--) {
    const n = nodes[ni];

    // Output ports
    for (let i = 0; i < n.outputs.length; i++) {
      const px = n.x + n.width;
      const py = n.y + HEADER_H + i * PORT_H + PORT_H / 2;
      if (Math.hypot(wx - px, wy - py) < PORT_HIT_R) {
        return { node: n, side: 'output', idx: i };
      }
    }

    // Input ports
    for (let i = 0; i < n.inputs.length; i++) {
      const px = n.x;
      const py = n.y + HEADER_H + i * PORT_H + PORT_H / 2;
      if (Math.hypot(wx - px, wy - py) < PORT_HIT_R) {
        return { node: n, side: 'input', idx: i };
      }
    }
  }
  return null;
}

function edgeHitTest(wx, wy) {
  for (let i = edges.length - 1; i >= 0; i--) {
    const e = edges[i];
    const srcNode = nodeMap[e.sourceNodeId];
    const tgtNode = nodeMap[e.targetNodeId];
    if (!srcNode || !tgtNode) continue;

    const sx = srcNode.x + srcNode.width;
    const sy = srcNode.y + HEADER_H + e.sourcePortIdx * PORT_H + PORT_H / 2;
    const tx = tgtNode.x;
    const ty = tgtNode.y + HEADER_H + e.targetPortIdx * PORT_H + PORT_H / 2;

    // Sample bezier
    const dist = Math.abs(tx - sx);
    const cpOff = Math.max(60, dist * 0.4);
    for (let t = 0; t <= 1; t += 0.05) {
      const tt = 1 - t;
      const bx = tt*tt*tt*sx + 3*tt*tt*t*(sx+cpOff) + 3*tt*t*t*(tx-cpOff) + t*t*t*tx;
      const by = tt*tt*tt*sy + 3*tt*tt*t*sy + 3*tt*t*t*ty + t*t*t*ty;
      if (Math.hypot(wx - bx, wy - by) < EDGE_HIT_DIST) {
        return i;
      }
    }
  }
  return null;
}

function removeEdge(edgeIdx) {
  const e = edges[edgeIdx];
  const tgtNode = nodeMap[e.targetNodeId];
  if (tgtNode) {
    const port = tgtNode.inputs[e.targetPortIdx];
    if (port) {
      setNestedParam(tgtNode.parameters, port.param, '');
      const pn = pipelineNodes.find(p => p.id === tgtNode.id);
      if (pn) setNestedParam(pn.parameters, port.param, '');
    }
  }
  edges.splice(edgeIdx, 1);
  markDirty();
  render();
}

// ---------------------------------------------------------------------------
// Node palette
// ---------------------------------------------------------------------------
function showPalette() {
  document.getElementById('paletteOverlay').classList.add('open');
  document.getElementById('paletteSearch').value = '';
  renderPalette();
  document.getElementById('paletteSearch').focus();
}

function hidePalette() {
  document.getElementById('paletteOverlay').classList.remove('open');
}

function renderPalette(filter = '') {
  const container = document.getElementById('paletteContent');
  container.innerHTML = '';
  const lf = filter.toLowerCase();

  // Group templates by category
  const categories = {};
  for (const [key, tmpl] of Object.entries(templates)) {
    const cat = tmpl.category || 'ai';
    if (!categories[cat]) categories[cat] = [];
    if (lf && !tmpl.label.toLowerCase().includes(lf) && !key.includes(lf)) continue;
    categories[cat].push({ key, ...tmpl });
  }

  const catOrder = ['sensor', 'filter', 'ai', 'streaming', 'audio', 'ui', 'utils'];
  for (const cat of catOrder) {
    const items = categories[cat];
    if (!items || items.length === 0) continue;

    const div = document.createElement('div');
    div.className = 'palette-category';

    const h4 = document.createElement('h4');
    h4.textContent = cat.toUpperCase();
    div.appendChild(h4);

    for (const item of items) {
      const row = document.createElement('div');
      row.className = 'palette-item';
      row.onclick = () => { addNodeFromTemplate(item.key); hidePalette(); };

      const c = COLORS[cat] || COLORS.ai;
      row.innerHTML = `
        <span class="badge" style="background:${c.badgeBg};color:${c.text}">${c.badge}</span>
        <div class="info">
          <div class="name">${item.label}</div>
          <div class="ports">in: ${item.inputs.length} / out: ${item.outputs.length}</div>
        </div>
      `;
      div.appendChild(row);
    }

    container.appendChild(div);
  }
}

document.getElementById('paletteSearch').addEventListener('input', (e) => {
  renderPalette(e.target.value);
});

document.getElementById('paletteOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('paletteOverlay')) hidePalette();
});

function addNodeFromTemplate(templateKey) {
  const tmpl = templates[templateKey];
  if (!tmpl) return;

  const uid = templateKey + '_' + Math.random().toString(36).slice(2, 8);
  const count = pipelineNodes.filter(pn => pn._template === templateKey).length + 1;
  const nodeName = templateKey.replace('fv_', '') + '_' + count;

  const pn = {
    id: uid,
    enable: true,
    package: tmpl.package,
    exec: tmpl.exec,
    node_name: nodeName,
    namespace: '/fv',
    parameters: JSON.parse(JSON.stringify(tmpl.default_parameters || {})),
    _template: templateKey,
  };

  pipelineNodes.push(pn);
  buildGraph();
  markDirty();

  // Select the new node
  const newNode = nodeMap[uid];
  if (newNode) {
    selectedNode = newNode;
    openEditPanel(newNode);
  }
}

// ---------------------------------------------------------------------------
// Edit panel
// ---------------------------------------------------------------------------
function openEditPanel(node) {
  const panel = document.getElementById('editPanel');
  panel.classList.add('open');
  document.getElementById('editTitle').textContent =
    (node._isTopicSource ? '[External] ' : '') + node.label;
  document.getElementById('editNodeName').value = node.node_name;
  document.getElementById('editNamespace').value = node.namespace;
  document.getElementById('editParams').value =
    JSON.stringify(node.parameters, null, 2);

  // Disable launch/stop for topic sources
  document.getElementById('btnEditLaunch').disabled = node._externalSource;
  document.getElementById('btnEditStop').disabled = node._externalSource;
}

function closeEditPanel() {
  document.getElementById('editPanel').classList.remove('open');
}

function applyEdit() {
  if (!selectedNode) return;
  const n = selectedNode;

  n.node_name = document.getElementById('editNodeName').value;
  n.namespace = document.getElementById('editNamespace').value;

  try {
    n.parameters = JSON.parse(document.getElementById('editParams').value);
  } catch (e) {
    toast('Invalid JSON in parameters', true);
    return;
  }

  // Sync to pipeline node
  const pn = pipelineNodes.find(p => p.id === n.id);
  if (pn) {
    pn.node_name = n.node_name;
    pn.namespace = n.namespace;
    pn.parameters = n.parameters;
  }

  buildEdges();
  markDirty();
  render();
  toast('Applied');
}

function deleteSelectedNode() {
  if (!selectedNode) return;
  const id = selectedNode.id;

  // Remove from pipeline
  pipelineNodes = pipelineNodes.filter(pn => pn.id !== id);

  // Remove edges pointing to/from this node
  edges = edges.filter(e =>
    e.sourceNodeId !== id && e.targetNodeId !== id);

  // Clear input params that referenced this node's outputs
  const gn = nodeMap[id];
  if (gn) {
    for (const out of gn.outputs) {
      const topic = resolveOutputTopic(gn, out);
      for (const n2 of nodes) {
        if (n2.id === id) continue;
        for (const inp of n2.inputs) {
          if (getNestedParam(n2.parameters, inp.param) === topic) {
            setNestedParam(n2.parameters, inp.param, '');
            const pn2 = pipelineNodes.find(p => p.id === n2.id);
            if (pn2) setNestedParam(pn2.parameters, inp.param, '');
          }
        }
      }
    }
  }

  selectedNode = null;
  closeEditPanel();
  buildGraph();
  markDirty();
}

// ---------------------------------------------------------------------------
// Toolbar actions
// ---------------------------------------------------------------------------
document.getElementById('btnAddNode').onclick = showPalette;

document.getElementById('btnNew').onclick = () => {
  const name = prompt('Pipeline name:');
  if (!name) return;
  pipelineSystem = {
    camera_start_delay: 2.0,
    default_start_delay: 0.5,
    container_start_delay: 1.0,
  };
  pipelineExtras = {};
  currentPipeline = name;
  pipelineNodes = [];
  pipelineContainers = [];
  selectedContainerId = '';
  buildGraph();
  renderDockerPanel();
  dirty = true;
};

document.getElementById('btnSave').onclick = () => {
  if (!currentPipeline) {
    document.getElementById('btnSaveAs').click();
    return;
  }
  const data = buildPipelineData();
  wsSend({ type: 'save_pipeline', name: currentPipeline, pipeline: data });
};

document.getElementById('btnSaveAs').onclick = () => {
  const name = prompt('Save pipeline as:', currentPipeline || '');
  if (!name) return;
  currentPipeline = name;
  const data = buildPipelineData();
  wsSend({ type: 'save_pipeline', name: name, pipeline: data });
};

document.getElementById('btnDelete').onclick = () => {
  if (!currentPipeline) return;
  if (!confirm(`Delete pipeline "${currentPipeline}"?`)) return;
  wsSend({ type: 'delete_pipeline', name: currentPipeline });
};

document.getElementById('pipelineSelect').onchange = (e) => {
  const val = e.target.value;
  if (!val) return;

  if (dirty && !confirm('Discard unsaved changes?')) {
    e.target.value = '';
    return;
  }

  // Stop all running nodes first
  wsSend({ type: 'stop_pipeline', pipeline: buildPipelineData() });

  const [prefix, name] = val.split(':');
  wsSend({
    type: 'load_pipeline',
    name: name,
    builtin: prefix === 'builtin',
  });
};

document.getElementById('btnLaunchAll').onclick = () => {
  const data = buildPipelineData();
  wsSend({ type: 'launch_pipeline', pipeline: data });
};

document.getElementById('btnStopAll').onclick = () => {
  wsSend({ type: 'stop_pipeline', pipeline: buildPipelineData() });
};
document.getElementById('btnDocker').onclick = openDockerPanel;
document.getElementById('btnDockerRefresh').onclick = refreshContainerStatuses;
document.getElementById('btnDockerClose').onclick = closeDockerPanel;
document.getElementById('btnDockerAdd').onclick = addContainerToPipeline;
document.getElementById('btnDockerApply').onclick = applyContainerEdit;
document.getElementById('btnDockerStart').onclick = startSelectedContainer;
document.getElementById('btnDockerStop').onclick = stopSelectedContainer;
document.getElementById('btnDockerLogs').onclick = fetchSelectedContainerLogs;
document.getElementById('btnDockerRemove').onclick = removeSelectedContainer;
document.getElementById('dockerEditTemplate').onchange = updateDockerEditorTemplate;

// Edit panel buttons
document.getElementById('btnEditApply').onclick = applyEdit;
document.getElementById('btnEditClose').onclick = closeEditPanel;
document.getElementById('btnEditDelete').onclick = deleteSelectedNode;

document.getElementById('btnEditLaunch').onclick = () => {
  if (!selectedNode) return;
  wsSend({
    type: 'launch_node',
    node_id: selectedNode.id,
    package: selectedNode.package,
    exec: selectedNode.exec,
    node_name: selectedNode.node_name,
    namespace: selectedNode.namespace,
    parameters: selectedNode.parameters,
    _template: selectedNode._template || '',
  });
};

document.getElementById('btnEditStop').onclick = () => {
  if (!selectedNode) return;
  wsSend({ type: 'stop_node', node_id: selectedNode.id });
};

// ---------------------------------------------------------------------------
// Utilities
// ---------------------------------------------------------------------------
function markDirty() {
  dirty = true;
}

function clearCanvas() {
  pipelineNodes = [];
  pipelineContainers = [];
  currentPipeline = '';
  pipelineSystem = {
    camera_start_delay: 2.0,
    default_start_delay: 0.5,
    container_start_delay: 1.0,
  };
  pipelineExtras = {};
  selectedContainerId = '';
  dirty = false;
  buildGraph();
  renderDockerPanel();
}

function autoFitView() {
  if (nodes.length === 0) {
    panX = 0; panY = 0; zoom = 1;
    return;
  }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of nodes) {
    minX = Math.min(minX, n.x);
    minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + n.width);
    maxY = Math.max(maxY, n.y + n.height);
  }

  const pad = 60;
  const cw = canvas.width / dpr;
  const ch = canvas.height / dpr;
  const graphW = maxX - minX + pad * 2;
  const graphH = maxY - minY + pad * 2;

  zoom = Math.min(1.5, Math.min(cw / graphW, ch / graphH));
  panX = (cw - graphW * zoom) / 2 - (minX - pad) * zoom;
  panY = (ch - graphH * zoom) / 2 - (minY - pad) * zoom;
  render();
}

function toast(message, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.style.borderColor = isError ? 'var(--danger)' : 'var(--accent)';
  el.style.display = 'block';
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.style.display = 'none'; }, 3000);
}

// ---------------------------------------------------------------------------
// Keyboard shortcuts
// ---------------------------------------------------------------------------
document.addEventListener('keydown', (e) => {
  // Escape: close palette / edit panel
  if (e.key === 'Escape') {
    hidePalette();
    closeEditPanel();
    closeDockerPanel();
    wiring = null;
    render();
  }

  // Delete: remove selected node
  if ((e.key === 'Delete' || e.key === 'Backspace') &&
      selectedNode &&
      !document.querySelector('#editPanel.open input:focus, #editPanel.open textarea:focus')) {
    deleteSelectedNode();
  }

  // Ctrl+S: save
  if (e.key === 's' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    document.getElementById('btnSave').click();
  }

  // A: add node (when not in input)
  if (e.key === 'a' && !e.ctrlKey && !e.metaKey &&
      document.activeElement.tagName !== 'INPUT' &&
      document.activeElement.tagName !== 'TEXTAREA') {
    showPalette();
  }

  // F: fit view
  if (e.key === 'f' && !e.ctrlKey && !e.metaKey &&
      document.activeElement.tagName !== 'INPUT' &&
      document.activeElement.tagName !== 'TEXTAREA') {
    autoFitView();
  }
});

// ---------------------------------------------------------------------------
// Initialization
// ---------------------------------------------------------------------------
resizeCanvas();
connectWS();

// Request statuses periodically
setInterval(() => {
  wsSend({ type: 'get_statuses' });
}, 3000);
</script>
