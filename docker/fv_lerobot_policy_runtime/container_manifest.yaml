containers:
  - key: fv_lerobot_policy_runtime
    label: "FV LeRobot Policy Runtime"
    category: ai_runtime
    image: "fv-lerobot-policy-runtime:latest"
    default_parameters:
      image: "fv-lerobot-policy-runtime:latest"
      container_name: "fv-lerobot-policy-runtime"
      network_host: true
      gpu: true
      env_files:
        - "/home/aspa/daihen-physical-ai/data/.env"
      env:
        DPEX_PORT: "8010"
        DPEX_LOAD_ON_START: "true"
        # 既定ではモデルを積まない。使うモデルは DPEX から書き出した上で
        # "key:policy_type:/data/models/<model_id>" 形式をセミコロン区切りで指定する。
        DPEX_POLICY_SPECS: ""
        DPEX_CAMERA_ALIASES: "cam_high=top_camera,top=top_camera,top_camera=top_camera,cam_left_wrist=arm_camera,cam_right_wrist=arm_camera,arm=arm_camera,arm_camera=arm_camera"
        HF_HOME: "/data/.cache/huggingface"
        TRANSFORMERS_CACHE: "/data/.cache/huggingface"
        TORCH_HOME: "/data/.cache/torch"
      volumes:
        - host: "/home/aspa/daihen-physical-ai/data"
          container: "/data"
        - host: "/home/aspa/ros2_ws/src/fluent_vision_ros2/docker/fv_lerobot_policy_runtime/policy_models.yaml"
          container: "/opt/fv-lerobot-policy-runtime/policy_models.yaml"
          read_only: true
      command: []
