<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'Segoe UI','Hiragino Sans','Noto Sans CJK JP',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a17"/>
      <stop offset="1" stop-color="#12241f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4a7"/>
      <stop offset="1" stop-color="#1fa887"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4a7"/>
    </marker>
    <marker id="arrowdim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a7a70"/>
    </marker>
  </defs>

  <rect width="1240" height="700" rx="14" fill="url(#bg)"/>

  <!-- Title -->
  <text x="40" y="52" fill="#e8f5f0" font-size="26" font-weight="700">FluentVision ROS 2 — Architecture</text>
  <text x="40" y="76" fill="#7fa89c" font-size="14">YAML pipelines wire sensors → AI → streaming; everything is a ROS 2 node / YAMLパイプラインがセンサー→AI→配信を配線</text>

  <!-- ================= Pipeline YAML (top center) ================= -->
  <rect x="420" y="100" width="400" height="72" rx="10" fill="#1c3a32" stroke="#2dd4a7" stroke-width="2"/>
  <text x="620" y="130" fill="#2dd4a7" font-size="17" font-weight="700" text-anchor="middle">pipelines/*.yaml</text>
  <text x="620" y="152" fill="#a8cfc4" font-size="13" text-anchor="middle">declarative node graph — 宣言的ノードグラフ</text>

  <!-- Launcher + Editor -->
  <rect x="150" y="100" width="230" height="72" rx="10" fill="#15302a" stroke="#3d6b5e" stroke-width="1.5"/>
  <text x="265" y="130" fill="#d8ede6" font-size="15" font-weight="600" text-anchor="middle">fluent_vision_system</text>
  <text x="265" y="151" fill="#7fa89c" font-size="12" text-anchor="middle">YAML launcher — 起動器</text>

  <rect x="860" y="100" width="230" height="72" rx="10" fill="#15302a" stroke="#3d6b5e" stroke-width="1.5"/>
  <text x="975" y="130" fill="#d8ede6" font-size="15" font-weight="600" text-anchor="middle">fv_pipeline_editor</text>
  <text x="975" y="151" fill="#7fa89c" font-size="12" text-anchor="middle">browser editor :8095 — 可視編集</text>

  <line x1="420" y1="136" x2="384" y2="136" stroke="#2dd4a7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860" y1="136" x2="824" y2="136" stroke="#2dd4a7" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- spawn arrow -->
  <line x1="265" y1="172" x2="265" y2="216" stroke="#2dd4a7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="278" y="200" fill="#7fa89c" font-size="12">spawns nodes / ノード起動</text>

  <!-- ================= Sensors column ================= -->
  <rect x="40" y="222" width="250" height="180" rx="12" fill="#122822" stroke="#2a4f45" stroke-width="1.5"/>
  <text x="165" y="252" fill="#2dd4a7" font-size="16" font-weight="700" text-anchor="middle">📷 Sensors — センサー</text>
  <rect x="60" y="268" width="210" height="52" rx="8" fill="#183630"/>
  <text x="165" y="290" fill="#d8ede6" font-size="14" font-weight="600" text-anchor="middle">fv_realsense</text>
  <text x="165" y="309" fill="#7fa89c" font-size="11.5" text-anchor="middle">D405 / D415 / D455 · BEST_EFFORT</text>
  <rect x="60" y="330" width="210" height="52" rx="8" fill="#183630"/>
  <text x="165" y="352" fill="#d8ede6" font-size="14" font-weight="600" text-anchor="middle">fv_camera</text>
  <text x="165" y="371" fill="#7fa89c" font-size="11.5" text-anchor="middle">USB / RPi / network cameras</text>

  <!-- topics arrow -->
  <line x1="290" y1="312" x2="352" y2="312" stroke="#2dd4a7" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="322" y="298" fill="#7fa89c" font-size="11" text-anchor="middle">/fv/realsense_1/…</text>

  <!-- ================= AI column ================= -->
  <rect x="356" y="222" width="290" height="330" rx="12" fill="#122822" stroke="#2a4f45" stroke-width="1.5"/>
  <text x="501" y="252" fill="#2dd4a7" font-size="16" font-weight="700" text-anchor="middle">🧠 AI &amp; 3D — 推論・3D</text>
  <text x="376" y="284" fill="#d8ede6" font-size="13">YOLOE · YOLO-seg · UNet · AprilTag</text>
  <text x="376" y="308" fill="#d8ede6" font-size="13">Depth Anything · LingBot-Depth</text>
  <text x="376" y="332" fill="#d8ede6" font-size="13">3D OBB · cube pose · color+depth</text>
  <text x="376" y="356" fill="#d8ede6" font-size="13">detection fusion · policy runner</text>
  <text x="376" y="380" fill="#d8ede6" font-size="13">asparagus points / stalk estimator</text>
  <line x1="376" y1="398" x2="626" y2="398" stroke="#2a4f45" stroke-width="1"/>
  <text x="376" y="422" fill="#7fa89c" font-size="12">TensorRT / ONNX Runtime / OpenVINO</text>
  <text x="376" y="444" fill="#7fa89c" font-size="12">Jetson Orin / AGX Thor · x86_64</text>
  <text x="376" y="480" fill="#a8cfc4" font-size="12.5">→ /fv/&lt;task&gt;/detections</text>
  <text x="376" y="502" fill="#a8cfc4" font-size="12.5">→ /fv/&lt;task&gt;/objects_3d</text>
  <text x="376" y="524" fill="#a8cfc4" font-size="12.5">→ /fv/&lt;task&gt;/overlay · mask</text>

  <!-- arrow AI -> streaming -->
  <line x1="646" y1="312" x2="708" y2="312" stroke="#2dd4a7" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ================= Streaming column ================= -->
  <rect x="712" y="222" width="250" height="330" rx="12" fill="#122822" stroke="#2a4f45" stroke-width="1.5"/>
  <text x="837" y="252" fill="#2dd4a7" font-size="16" font-weight="700" text-anchor="middle">📡 Streaming — 配信・記録</text>
  <text x="732" y="284" fill="#d8ede6" font-size="13">HTTP image server :8080</text>
  <text x="732" y="308" fill="#d8ede6" font-size="13">WebSocket / binary pointcloud WS</text>
  <text x="732" y="332" fill="#d8ede6" font-size="13">RTMP (OBS) · image distributor</text>
  <line x1="732" y1="350" x2="942" y2="350" stroke="#2a4f45" stroke-width="1"/>
  <text x="732" y="376" fill="#d8ede6" font-size="13" font-weight="600">fv_episode_recorder</text>
  <text x="732" y="398" fill="#7fa89c" font-size="12">rosbag + MP4 + markers + JSON</text>
  <text x="732" y="418" fill="#7fa89c" font-size="12">→ LeRobot / VLA datasets</text>
  <line x1="732" y1="436" x2="942" y2="436" stroke="#2a4f45" stroke-width="1"/>
  <text x="732" y="462" fill="#d8ede6" font-size="13" font-weight="600">🔊 Audio — 音声</text>
  <text x="732" y="484" fill="#7fa89c" font-size="12">capture · VAD / wakeword · TTS</text>

  <!-- ================= Consumers ================= -->
  <rect x="1000" y="222" width="200" height="330" rx="12" fill="#122822" stroke="#2a4f45" stroke-width="1.5"/>
  <text x="1100" y="252" fill="#2dd4a7" font-size="16" font-weight="700" text-anchor="middle">🖥️ Consumers</text>
  <text x="1020" y="284" fill="#d8ede6" font-size="13">Browser / dashboard</text>
  <text x="1020" y="308" fill="#d8ede6" font-size="13">OBS / recorders</text>
  <text x="1020" y="332" fill="#d8ede6" font-size="13">Robot navigation</text>
  <text x="1020" y="356" fill="#d8ede6" font-size="13">Manipulation / VLA</text>
  <line x1="962" y1="312" x2="996" y2="312" stroke="#2dd4a7" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ================= Bottom band: core + external ================= -->
  <rect x="40" y="576" width="700" height="96" rx="12" fill="#10231e" stroke="#2dd4a7" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="606" fill="#2dd4a7" font-size="15" font-weight="700">🎨 core/ — GPU rendering core（ROS非依存 / no ROS dependency）</text>
  <text x="60" y="630" fill="#d8ede6" font-size="13">fluent_scene — typed .fvs scene → Vulkan composite (~26× CPU)</text>
  <text x="60" y="652" fill="#d8ede6" font-size="13">fluent_stage — Stage/Layer/Surface runtime · 30 filters · UI · stage_web/scene_web</text>

  <rect x="772" y="576" width="428" height="96" rx="12" fill="#10231e" stroke="#5a7a70" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="792" y="606" fill="#8fb5aa" font-size="15" font-weight="700">🐳 docker/ — external runtimes（外部推論）</text>
  <text x="792" y="630" fill="#d8ede6" font-size="13">FoundationPose · LingBot-Depth · OpenPI / LeRobot</text>
  <text x="792" y="652" fill="#7fa89c" font-size="12">bridged into ROS 2 by fv_* bridge nodes</text>

  <line x1="501" y1="552" x2="501" y2="572" stroke="#5a7a70" stroke-width="1.5" marker-end="url(#arrowdim)"/>
  <line x1="837" y1="552" x2="837" y2="572" stroke="#5a7a70" stroke-width="1.5" marker-end="url(#arrowdim)"/>
</svg>
