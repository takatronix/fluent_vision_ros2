# fv_object_detector params for the browser demo — yolov10n, COCO 80 classes.
/fv/object_detector_coco:
  ros__parameters:
    input_image_topic: /fv/browser_cam/coco/image_raw
    output_image_topic: /fv/browser_demo/coco/overlay
    output_detections_topic: /fv/browser_demo/coco/detections
    processing_frequency: 10.0
    enable_tracking: true
    enable_visualization: true
    show_stats_on_image: true
    publish_annotated_image: true
    model:
      type: yolov10
      model_path: /app/models/openvino/yolov10n_coco.xml
      device: CPU
      input_width: 640
      input_height: 640
      confidence_threshold: 0.4
    class_names:
      - person
      - bicycle
      - car
      - motorcycle
      - airplane
      - bus
      - train
      - truck
      - boat
      - traffic light
