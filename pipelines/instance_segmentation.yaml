name: "Instance Segmentation"
description: "RealSense → YOLO Instance Segmentation"

system:
  camera_start_delay: 2.0
  default_start_delay: 0.5

nodes:
  - id: realsense_1
    enable: true
    package: fv_realsense
    exec: fv_realsense_node
    node_name: realsense_1
    namespace: /fv
    parameters:
      camera_selection:
        selection_method: "auto"
      camera:
        color_width: 640
        color_height: 480
        color_fps: 15
    _template: fv_realsense

  - id: instance_seg_1
    enable: true
    package: fv_instance_seg
    exec: fv_instance_seg_node
    node_name: instance_seg_1
    namespace: /fv
    parameters:
      input_image_topic: /fv/realsense_1/color/image_raw
      backend: "auto"
      device: "GPU"
      conf_thres: 0.25
      iou_thres: 0.5
    _template: fv_instance_seg

layout:
  realsense_1: { x: 100, y: 200, width: 210 }
  instance_seg_1: { x: 420, y: 200, width: 230 }
