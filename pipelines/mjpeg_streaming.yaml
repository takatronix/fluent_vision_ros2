name: "MJPEG Streaming"
description: "RealSense → MJPEG Server (port 8090)"

system:
  camera_start_delay: 2.0
  default_start_delay: 0.5

nodes:
  - id: realsense_1
    enable: true
    package: fv_realsense
    exec: fv_realsense_node
    node_name: realsense_1
    namespace: /fv
    parameters:
      camera_selection:
        selection_method: "auto"
      camera:
        color_width: 640
        color_height: 480
        color_fps: 30
    _template: fv_realsense

  - id: mjpeg_server_1
    enable: true
    package: fv_mjpeg_server
    exec: fv_mjpeg_server_node
    node_name: mjpeg_server_1
    namespace: /fv
    parameters:
      image_topic: /fv/realsense_1/color/image_raw
      port: 8090
    _template: fv_mjpeg_server

layout:
  realsense_1: { x: 100, y: 200, width: 210 }
  mjpeg_server_1: { x: 420, y: 200, width: 200 }
